  el.textContent=msg;
  el.classList.toggle('winning', win);
}

// ════════════════════════════════════════════════════════════
//  ANALYSIS ENGINE
// ════════════════════════════════════════════════════════════

// Iterate every k-combination of arr, reusing a single buffer for speed
function iterCombos(arr, k, fn) {
  const n   = arr.length;
  const idx = Array.from({length:k}, (_,i)=>i);
  const buf = new Array(k);
  for(;;) {
    for(let j=0;j<k;j++) buf[j] = arr[idx[j]];
    fn(buf);
    let i = k-1;
    while(i>=0 && idx[i]===n-k+i) i--;
    if(i<0) break;
    idx[i]++;
    for(let j=i+1;j<k;j++) idx[j]=idx[j-1]+1;
  }
}

// ── EV analysis Web Worker ───────────────────────────────────
// The full 32-mask computation (up to ~2.6M hand evaluations) runs OFF the
// main thread so card taps stay instant during the hold phase. The worker
// is built from a Blob of this file's own evaluator functions, so the game
// stays a single self-contained file (and works offline).
// Shared by the EV worker and the strategy simulator worker: constants, every
// evaluator, the combination iterator and the strategy classifier.
function workerCommonSource(){
  const fns = [rankIndex, evaluate, rankVal, evalBonusStyle, evalDeuces, evalTens, evalDDB,
               evalJoker, evalJokerTP, evalTripleBonus, evalSuperDB, evalSuperDDB,
               evalBonusDeuces, iterCombos, nStraightWindows, nWindowsNeeding2,
               classifyHold, classifyHoldWild]
    .map(f => f.toString()).join('\n');
  return 'const RANKS = ' + JSON.stringify(RANKS) + ';\n' +
         'const SUITS = ' + JSON.stringify(SUITS) + ';\n' +
         'const RL_STRAT = ' + JSON.stringify(RL_STRAT) + ';\n' + fns + `
const EVAL_FNS = { jacks: evaluate, tens: evalTens, allamerican: evaluate, bonus: evalBonusStyle,
                   bpdeluxe: evaluate, dbonus: evalBonusStyle, ddbonus: evalDDB,
                   tbonus: evalTripleBonus, tdbonus: evalDDB, sdbonus: evalSuperDB,
                   sddbonus: evalSuperDDB, joker: evalJoker, joker2: evalJokerTP,
                   deuces: evalDeuces, loose: evalDeuces, bdeuces: evalBonusDeuces };
`;
}

function evWorkerSource(){
  const main = `
self.onmessage = e => {
  const { token, gameKey, rows, coinBet, hand, deck } = e.data;
  const evalFn = EVAL_FNS[gameKey];
  const nCats  = rows.length;
  const rh  = new Array(5);
  const out = [];
  for(let mask=0; mask<32; mask++){
    const heldCards = [];
    for(let i=0;i<5;i++) if(mask & (1<<i)) heldCards.push(hand[i]);
    const drawN = 5 - heldCards.length;
    for(let i=0;i<heldCards.length;i++) rh[i] = heldCards[i];
    const handSum    = new Float64Array(nCats);
    const handCounts = new Int32Array(nCats);
    let cnt = 0;
    if(drawN === 0){
      const hi = evalFn(hand);
      handSum[hi]    += rows[hi].pays[coinBet-1];
      handCounts[hi] += 1;
      cnt = 1;
    } else {
      iterCombos(deck, drawN, combo => {
        for(let i=0;i<drawN;i++) rh[heldCards.length+i] = combo[i];
        const hi = evalFn(rh);
        handSum[hi]    += rows[hi].pays[coinBet-1];
        handCounts[hi] += 1;
        cnt++;
      });
    }
    const handEV   = Array.from(handSum,    v => v / cnt);
    const handOdds = Array.from(handCounts, c => c / cnt);
    out.push({ mask, heldCards, ev: handEV.reduce((s,v)=>s+v,0), handEV, handOdds });
  }
  out.sort((a,b) => b.ev - a.ev);
  self.postMessage({ token, results: out });
};`;
  return workerCommonSource() + main;
}

let evWorker  = null;
let evPending = {};
function getEVWorker(){
  if(evWorker) return evWorker;
  const blob = new Blob([evWorkerSource()], { type: 'text/javascript' });
  evWorker = new Worker(URL.createObjectURL(blob));
  evWorker.onmessage = e => {
    const { token, results } = e.data;
    const resolve = evPending[token];
    delete evPending[token];
    if(resolve) resolve(results);
  };
  return evWorker;
}

// Discard any computed/in-flight analysis (new deal, game or pay-table change)
function invalidateAnalysis(){
  analysisResults = null;
  analysisPromise = null;
  analysisToken++;
}

// Kick off EV computation in the worker. Snapshots hand/deck so changes
// during the hold phase don't corrupt results. Returns a promise of the
// ranked results; also stores them in analysisResults when they arrive.
let analysisPromise = null;
function startAnalysisAsync(snapHand, snapDeck) {
  analysisResults = null;
  const token = ++analysisToken;
  const h = (snapHand || hand).slice();
  const d = (snapDeck || deck).slice();
  analysisPromise = new Promise(resolve => {
    try {
      evPending[token] = resolve;
      getEVWorker().postMessage({
        token, gameKey: currentGame, rows: curPayRows(), coinBet,
        hand: h, deck: d,
      });
    } catch(err) {
      // No Worker support — fall back to a main-thread computation
      delete evPending[token];
      resolve(computeAllEVs(h, d));
    }
  }).then(results => {
    if(token === analysisToken) analysisResults = results;
    return results;
  });
  return analysisPromise;
}

// EV for one hold bitmask against the current game's pay table.
// handSum[i]    = total coins paid by hand-type i across all draws
// handCounts[i] = number of draws producing hand-type i (for odds)
function computeMaskEV(mask, snapHand, snapDeck){
  const rows  = curPayRows();
  const nCats = rows.length;
  const evalFn = curGame().evaluate;
  const rh = new Array(5);

  const heldCards = [];
  for(let i=0;i<5;i++) if(mask & (1<<i)) heldCards.push(snapHand[i]);
  const drawN = 5 - heldCards.length;
  for(let i=0;i<heldCards.length;i++) rh[i] = heldCards[i];

  const handSum    = new Float64Array(nCats);
  const handCounts = new Int32Array(nCats);
  let cnt = 0;

  if(drawN === 0){
    const hi = evalFn(snapHand);
    handSum[hi]    += rows[hi].pays[coinBet-1];
    handCounts[hi] += 1;
    cnt = 1;
  } else {
    iterCombos(snapDeck, drawN, combo => {
      for(let i=0;i<drawN;i++) rh[heldCards.length+i] = combo[i];
      const hi = evalFn(rh);
      handSum[hi]    += rows[hi].pays[coinBet-1];
      handCounts[hi] += 1;
      cnt++;
    });
  }

  const handEV   = Array.from(handSum,    v => v / cnt);
  const handOdds = Array.from(handCounts, c => c / cnt);
  return { mask, heldCards, ev: handEV.reduce((s,v)=>s+v,0), handEV, handOdds };
}

// Compute EV for all 32 hold bitmasks, sorted best→worst
function computeAllEVs(snapHand, snapDeck) {
  const out = [];
  for(let mask=0; mask<32; mask++) out.push(computeMaskEV(mask, snapHand, snapDeck));
  return out.sort((a,b) => b.ev - a.ev);
}

// ════════════════════════════════════════════════════════════
//  STRATEGY GUIDE
//  Pre-computed Wizard-of-Odds-style strategy lists, generated offline by
//  strategy/strategy-gen.js and shipped as strategy-data/<key>.json.
//  classifyHold() is a straight port of the generator's classify() — the
//  two MUST stay in sync or line lookups silently mis-rank.
// ════════════════════════════════════════════════════════════

// Per-game pattern config, mirroring the generator's GAMES entries.
// minPair = lowest rank index that counts as a "high" pair (RANKS index:
// 8='10', 9='J', 11='K'). quadGroup splits quads the way the pay table does.
const STRAT_CFG = {
  jacks:    { minPair: 9, quadGroup: () => '' },
  tens:     { minPair: 8, quadGroup: () => '' },
  allamerican:{ minPair: 9, quadGroup: () => '' },
  bonus:    { minPair: 9, quadGroup: r => r === 12 ? 'A' : r <= 2 ? '234' : '5K' },
  bpdeluxe: { minPair: 9, quadGroup: () => '' },
  dbonus:   { minPair: 9, quadGroup: r => r === 12 ? 'A' : r <= 2 ? '234' : '5K' },
  ddbonus:  { minPair: 9, quadGroup: r => r === 12 ? 'A' : r <= 2 ? '234' : '5K' },
  tbonus:   { minPair: 11, quadGroup: r => r === 12 ? 'A' : r <= 2 ? '234' : '5K' },
  tdbonus:  { minPair: 9, quadGroup: r => r === 12 ? 'A' : r <= 2 ? '234' : '5K' },
  sdbonus:  { minPair: 9, quadGroup: r => r === 12 ? 'A' : (r >= 9 && r <= 11) ? 'JK' : r <= 2 ? '234' : '5T' },
  sddbonus: { minPair: 9, quadGroup: r => r === 12 ? 'A' : (r >= 9 && r <= 11) ? 'JK' : r <= 2 ? '234' : '5T' },
  // Wild games (generator: classifyWild). wild(c) marks the wild cards;
  // pat(cards) names a 5-card hand's paying category (null = nothing);
  // noNat2 = no natural 2 exists (deuces games); fiveGroup splits
  // five-of-a-kind / trips / pairs the way the pay table does.
  deuces:  { wild: c => c.rank === '2', wildName: 'deuce', noNat2: true, minPair: 13, fiveGroup: () => '',
             pat: cards => ['NRF','4D','WRF','5K','SF','4K','FH','FL','ST','3K'][evalDeuces(cards)] || null },
  loose:   { wild: c => c.rank === '2', wildName: 'deuce', noNat2: true, minPair: 13, fiveGroup: () => '',
             pat: cards => ['NRF','4D','WRF','5K','SF','4K','FH','FL','ST','3K'][evalDeuces(cards)] || null },
  bdeuces: { wild: c => c.rank === '2', wildName: 'deuce', noNat2: true, minPair: 13,
             fiveGroup: r => r === 12 ? 'A' : r <= 3 ? '35' : '6K',
             pat: cards => ['NRF','4DA','4D','WRF','5A','5_35','5_6K','SF','4K','FH','FL','ST','3K'][evalBonusDeuces(cards)] || null },
  joker:   { wild: c => !!c.joker, wildName: 'joker', noNat2: false, minPair: 11, fiveGroup: () => '',
             pat: cards => ['NRF','5K','WRF','SF','4K','FH','FL','ST','3K','2P','KB'][evalJoker(cards)] || null },
  joker2:  { wild: c => !!c.joker, wildName: 'joker', noNat2: false, minPair: 13, fiveGroup: () => '',
             pat: cards => ['NRF','5K','WRF','SF','4K','FH','FL','ST','3K','2P'][evalJokerTP(cards)] || null },
};

// Serialize a STRAT_CFG entry for a worker (functions by source; they only
// reference evaluators that the worker also carries)
function cfgSource(cfg){
  return '{' + Object.entries(cfg).map(([k, v]) => `${k}: ${typeof v === 'function' ? v.toString() : JSON.stringify(v)}`).join(', ') + '}';
}

const RL_STRAT = '23456789TJQKA';   // generator's rank letters, by rank index

// #5-card straight windows containing all of `ranks` (lo=-1 → the A2345 wheel)
function nStraightWindows(ranks){
  let n = 0;
  for(let lo = -1; lo <= 8; lo++){
    let ok = true;
    for(const r of ranks){
      const rr = (lo === -1 && r === 12) ? -1 : r;
      if(rr < lo || rr > lo + 4){ ok = false; break; }
    }
    if(ok) n++;
  }
  return n;
}

// Pattern id for a set of held cards — port of the generator's classify().
// Structural (not pay-based) so it stays correct for tables where several
// hand types share a payout (e.g. All American's 8/8/8).
function classifyHold(heldCards, cfg){
  if(cfg.wild) return classifyHoldWild(heldCards, cfg);
  const k = heldCards.length;
  if(k === 0) return 'DISCARD';
  const ranks = heldCards.map(c => rankIndex(c.rank)).sort((a,b) => b-a);
  const suited = heldCards.every(c => c.suit === heldCards[0].suit);
  // "High" = can make a paying pair in this game (jacks 9, tens 8, kings 11)
  const nHigh = ranks.filter(r => r >= cfg.minPair).length;
  const cnt = new Int8Array(13); ranks.forEach(r => cnt[r]++);
  let pairs = 0, pr = -1, trip = -1, quad = -1;
  for(let r = 0; r < 13; r++){
    if(cnt[r] === 2){ pairs++; pr = r; }
    if(cnt[r] === 3) trip = r;
    if(cnt[r] === 4) quad = r;
  }
  const rs = ranks.map(r => RL_STRAT[r]).join('');
  const qg = r => cfg.quadGroup(r);

  if(k === 5){
    if(quad >= 0) return `PAT_4K${qg(quad)}+${RL_STRAT[ranks.find(r => cnt[r] === 1)]}`;
    if(trip >= 0 && pairs) return 'PAT_FH';
    const straight = pairs === 0 && trip < 0 && quad < 0 && nStraightWindows(ranks) > 0;
    const royal = ranks.every(r => r >= 8);
    if(suited && straight && royal) return 'PAT_RF';
    if(suited && straight)          return 'PAT_SF';
    if(suited)                      return 'PAT_FL';
    if(straight)                    return 'PAT_ST';
    return 'JUNK';
  }
  if(quad >= 0) return `QUADS${qg(quad)}`;
  // trips, and trips + kicker (only played where the table pays a quad/kicker
  // bonus — Triple Double Bonus 4 aces + 2-4 kicker pays 800/coin)
  if(trip >= 0) return k === 3 ? `TRIPS${qg(trip)}`
    : k === 4 ? `TRIPSK${qg(trip)}_${qg(ranks.find(r => cnt[r] === 1))}` : 'JUNK';
  if(pairs === 2) return '2PAIR';
  if(pairs === 1){
    if(k !== 2) return 'JUNK';
    return (pr >= cfg.minPair ? 'PAIR_HI' : 'PAIR_LO') + qg(pr);
  }
  // all distinct ranks
  const nS = nStraightWindows(ranks);
  const royal = ranks.every(r => r >= 8);
  if(suited){
    if(k === 4) return royal ? 'RF4' : nS ? `SF4_s${nS}_h${nHigh}` : `FL4_h${nHigh}`;
    if(k === 3) return royal ? `RF3_${rs}` : nS ? `SF3_s${nS}_h${nHigh}` : `FL3_h${nHigh}`;
    if(k === 2) return royal ? `RF2_${rs}` : nS ? `SF2_s${nS}_h${nHigh}` : 'JUNK';
  } else {
    if(k === 4) return nS ? `ST4_s${nS}_h${nHigh}` : 'JUNK';
    if(k === 3) return nS ? `ST3_s${nS}_h${nHigh}` : nHigh === 3 ? `HI3_${rs}` : 'JUNK';
    if(k === 2) return nHigh === 2 ? `HI2_${rs}` : 'JUNK';
  }
  if(k === 1) return nHigh ? `HI1_${rs}` : 'JUNK';
  return 'JUNK';
}

// Straight windows A2345 / 23456 containing all ranks — in deuces games that
// 2-slot can only be filled by a wild (there is no natural 2)
function nWindowsNeeding2(ranks){
  let n = 0;
  for(const lo of [-1, 0]){
    let ok = true;
    for(const r of ranks){ const rr = (lo === -1 && r === 12) ? -1 : r; if(rr < lo || rr > lo + 4){ ok = false; break; } }
    if(ok) n++;
  }
  return n;
}

// Wild games — port of the generator's classifyWild(). Ids carry a "W<n>_"
// prefix for the wilds held plus the structure of the natural cards:
// W2_RF2 = 2 deuces + 2 suited high cards, W1_PAIR = deuce + pair, W3_ONLY.
function classifyHoldWild(heldCards, cfg){
  const nat = [];
  let w = 0;
  for(const c of heldCards){ if(cfg.wild(c)) w++; else nat.push(c); }
  const k = nat.length;
  if(k + w === 0) return 'DISCARD';
  const pre = w ? `W${w}_` : '';
  if(k + w === 5){ const nm = cfg.pat(heldCards); return nm ? `${pre}PAT_${nm}` : 'JUNK'; }
  if(k === 0) return `W${w}_ONLY`;
  const ranks = nat.map(c => rankIndex(c.rank)).sort((a,b) => b-a);
  const rs = ranks.map(r => RL_STRAT[r]).join('');
  const suited = nat.every(c => c.suit === nat[0].suit);
  const nHigh = ranks.filter(r => r >= cfg.minPair).length;
  const hq = cfg.minPair < 13 ? `_h${nHigh}` : '';
  const cnt = new Int8Array(13); ranks.forEach(r => cnt[r]++);
  let quad = -1, trip = -1, pr = -1, pairs = 0;
  for(let r = 0; r < 13; r++){ if(cnt[r] === 4) quad = r; if(cnt[r] === 3) trip = r; if(cnt[r] === 2){ pairs++; pr = r; } }
  const grp = cfg.fiveGroup;
  if(quad >= 0) return `${pre}QUADS${grp(quad)}`;
  if(trip >= 0) return k === 3 ? `${pre}TRIPS${grp(trip)}` : 'JUNK';
  if(pairs === 2) return `${pre}2PAIR`;
  if(pairs === 1){
    if(k !== 2) return 'JUNK';
    const tag = cfg.minPair < 13 ? (pr >= cfg.minPair ? 'PAIR_HI' : 'PAIR_LO') : 'PAIR';
    return `${pre}${tag}${grp(pr)}`;
  }
  // all naturals of distinct rank
  const nS = nStraightWindows(ranks);
  const n2 = (cfg.noNat2 && nS) ? `_n${nWindowsNeeding2(ranks)}` : '';
  const royal = ranks.every(r => r >= 8);
  if(k >= 2){
    if(suited){
      if(royal) return k === 4 ? 'RF4' : `${pre}RF${k}` + (w ? '' : `_${rs}`);
      if(nS) return `${pre}SF${k}_s${nS}${n2}${hq}`;
      return (w || k >= 3) ? `${pre}FL${k}${hq}` : 'JUNK';
    }
    if(nS) return `${pre}ST${k}_s${nS}${n2}${hq}`;
    return nHigh === k ? `${pre}HI${k}_${rs}` : 'JUNK';
  }
  // one natural card (rank-tagged: which card matters in wild games)
  if(nHigh) return `${pre}HI1_${rs}`;
  return `${pre}ONE_${rs}`;
}

// ── Strategy file loading ────────────────────────────────────
// One ~19 KB JSON per pay table, fetched on demand and then cached by the
// service worker (so a game you've opened once works offline).
const stratCache = {};     // key → data | 'missing'
function stratKeyFor(gameKey = currentGame, ptIdx = payTableIdx){
  const pt = GAMES[gameKey].payTables[ptIdx];
  return (pt && pt.strat) || null;
}
function loadStrategy(key){
  if(!key) return Promise.resolve(null);
  if(stratCache[key]) return Promise.resolve(stratCache[key] === 'missing' ? null : stratCache[key]);
  return fetch(`strategy-data/${key}.json`)
    .then(r => r.ok ? r.json() : Promise.reject(new Error('not found')))
    .then(d => { stratCache[key] = d; return d; })
    .catch(() => { stratCache[key] = 'missing'; return null; });
}

// Strategy levels: the full list, plus the simplified lists the generator
// exports (keyed by the fraction of optimal return they keep)
const STRAT_LEVELS = [['full','Full'], ['0.9995','Intermediate'], ['0.999','Simple'],
                      ['0.996','Basic'], ['0.993','Minimal']];
function stratLevelName(lvl = stratLevel){
  const e = STRAT_LEVELS.find(l => l[0] === lvl);
  return e ? e[1] : lvl;
}
// Line list [{ids, label}] and expected return for a level (falls back to full)
function stratLines(strat, lvl = stratLevel){
  const s = lvl !== 'full' && strat.simplified && strat.simplified[lvl];
  return s ? s.lines : strat.mergedLines;
}
function stratReturn(strat, lvl = stratLevel){
  const s = lvl !== 'full' && strat.simplified && strat.simplified[lvl];
  return s ? s.return : strat.basicReturn;
}

// Rank of each pattern id within a level's line list (lower = play first).
// The JSON's id arrays ARE the machine-readable strategy; labels are only
// for display. Cached per strategy object and level.
function stratRankMap(strat, lvl = stratLevel){
  strat._rankMaps = strat._rankMaps || {};
  if(!strat._rankMaps[lvl]){
    const m = {};
    stratLines(strat, lvl).forEach((line, i) => line.ids.forEach(id => { if(m[id] === undefined) m[id] = i; }));
    strat._rankMaps[lvl] = m;
  }
  return strat._rankMaps[lvl];
}

// The "book" play for a hand at a strategy level: of all 32 holds, the one
// whose pattern sits highest on the list. Several holds can land on the
// same line (a simplified list may say "unsuited QJ, KJ" for a Q-J-K hand);
// all of them are returned in `masks` and count as following the book.
// Returns { mask, masks, id, rank, label } or null when no line matches.
function bookPlay(handCards, strat, cfg, lvl = stratLevel){
  const rankMap = stratRankMap(strat, lvl);
  let best = null;
  for(let mask = 0; mask < 32; mask++){
    const heldCards = [];
    for(let i = 0; i < 5; i++) if(mask & (1<<i)) heldCards.push(handCards[i]);
    const id = classifyHold(heldCards, cfg);
    const rank = rankMap[id];
    if(rank === undefined) continue;           // never-played pattern
    if(!best || rank < best.rank) best = { mask, masks: [mask], id, rank };
    else if(rank === best.rank) best.masks.push(mask);
  }
  if(best){
    const line = stratLines(strat, lvl)[best.rank];
    best.label = line ? line.label : best.id;
  }
  return best;
}

// Instant verdict on the player's hold from the loaded strategy, or null
// when the analyzer must be used instead (judge setting is "Analyzer", no
// strategy for this pay table, or its file hasn't loaded yet).
function bookVerdict(playerMask){
  if(holdJudge !== 'strategy') return null;
  const strat = stratCache[stratKeyFor()];
  const cfg   = STRAT_CFG[currentGame];
  if(!strat || strat === 'missing' || !cfg) return null;
  const book = bookPlay(hand, strat, cfg);
  if(!book) return null;
  return { ok: book.masks.includes(playerMask), bestMask: book.mask, book: true };
}

// Number pad — replaces the iOS keyboard for every numeric entry.
// Resolves to the entered integer, or null if cancelled.
function showNumPad({ title = 'Enter a number', initial = '', min = 0, max = 9999999, hint = '' } = {}){
  return new Promise(resolve => {
    let val = (initial === null || initial === undefined) ? '' : String(initial);

    // behaves. Without this, typing 25000 over a prefilled 100000 appended
    // and then silently hit the length cap.
    let fresh = true;
    // room for the largest value the caller allows (plus one for a typo)
    const maxLen = String(max).length + 1;

    const overlay = document.createElement('div');
    overlay.style.cssText = [
      'position:fixed','inset:0','z-index:10002',
      'background:rgba(0,5,25,0.85)',
      'display:flex','align-items:center','justify-content:center',

    ].join(';');

    panel.style.cssText = [
      'background:linear-gradient(180deg,#0d2255 0%,#091840 100%)',
      'border:2px solid #2a4a9a','border-radius:14px',
      'box-shadow:0 0 30px rgba(20,60,180,0.6)',
      'padding:16px 18px','width:min(300px,90vw)',
      'display:flex','flex-direction:column','gap:10px',
    ].join(';');

    const ttl = document.createElement('div');
    ttl.style.cssText = 'text-align:center;font-size:14px;font-weight:bold;color:#f0c040;letter-spacing:2px;text-transform:uppercase;';
    ttl.textContent = title;

    const hintEl = document.createElement('div');
    hintEl.style.cssText = 'text-align:center;font-size:11px;color:#8899bb;min-height:14px;';
    hintEl.textContent = hint;

    const disp = document.createElement('div');
    disp.style.cssText = [
      'background:#0a1a40','border:2px solid #3a5aaa','border-radius:8px',
      'padding:10px 14px','text-align:right','font-size:28px','font-weight:bold',
      'color:#f0c040','min-height:52px','letter-spacing:1px','font-variant-numeric:tabular-nums',
    ].join(';');
    const refresh = () => { disp.textContent = val === '' ? ' ' : val; };
    refresh();

    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:8px;';
    const mkKey = (label, fn, extra = '') => {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = [
        'font-family:Arial,Helvetica,sans-serif','font-size:22px','font-weight:bold',
        'height:54px','background:#0a1a40','border:2px solid #3a5aaa','border-radius:8px',
        'color:#e0e8f8','cursor:pointer','touch-action:manipulation',
        '-webkit-tap-highlight-color:transparent', extra,
      ].join(';');
      b.addEventListener('pointerdown', () => { b.style.background = '#1a2a60'; });
      b.addEventListener('pointerup',   () => { b.style.background = '#0a1a40'; });
      b.addEventListener('pointerleave',() => { b.style.background = '#0a1a40'; });
      b.addEventListener('click', () => { sfx.button(); fn(); });
      return b;
    };
    const digit = d => {
      if(fresh){ val = ''; fresh = false; }
      if(val.length >= maxLen) return;
      val = (val === '0') ? d : val + d;
      hintEl.style.color = '#8899bb'; hintEl.textContent = hint; refresh();
    };
    ['1','2','3','4','5','6','7','8','9'].forEach(d => grid.appendChild(mkKey(d, () => digit(d))));
    grid.appendChild(mkKey('C', () => { val = ''; fresh = false; refresh(); }, 'color:#ff8080;font-size:18px'));
    grid.appendChild(mkKey('0', () => digit('0')));
    grid.appendChild(mkKey('⌫', () => { val = val.slice(0, -1); fresh = false; refresh(); }, 'color:#ffcc66'));

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:8px;';
    const mkAct = (label, bg, border, color) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = [
        'flex:1','font-family:Arial,Helvetica,sans-serif','font-size:14px','font-weight:bold',
        'letter-spacing:2px','text-transform:uppercase','padding:11px 0',
        `background:${bg}`,`border:2px solid ${border}`,'border-radius:8px',
        `color:${color}`,'cursor:pointer','touch-action:manipulation',
      ].join(';');
      return b;
    };
    const okBtn     = mkAct('OK','linear-gradient(180deg,#2a8a4a,#1a6a34)','#4acc6a','#fff');
    const cancelBtn = mkAct('Cancel','linear-gradient(180deg,#3a3a3a,#1a1a1a)','#666','#ccc');

    const close = result => {
      document.removeEventListener('keydown', onKey);
      if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
      resolve(result);
    };
    const submit = () => {
      const n = parseInt(val, 10);
      if(isNaN(n)){ hintEl.style.color = '#ff8080'; hintEl.textContent = 'Enter a number'; sfx.thump(); return; }
      if(n < min || n > max){
        hintEl.style.color = '#ff8080';
        hintEl.textContent = `Enter a value from ${min} to ${max}`;
        sfx.thump();
        return;
      }
      sfx.button();
      close(n);
    };
    okBtn.addEventListener('click', submit);
    cancelBtn.addEventListener('click', () => close(null));
    overlay.addEventListener('click', e => { if(e.target === overlay) close(null); });
    // Desktop convenience: physical keyboard works too
    const onKey = e => {
      if(/^[0-9]$/.test(e.key)) { digit(e.key); e.preventDefault(); }
      else if(e.key === 'Backspace') { val = val.slice(0,-1); fresh = false; refresh(); e.preventDefault(); }
      else if(e.key === 'Enter')  { submit(); e.preventDefault(); }
      else if(e.key === 'Escape') { close(null); e.preventDefault(); }
    };
    document.addEventListener('keydown', onKey);

    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    panel.appendChild(ttl);
    panel.appendChild(disp);
    panel.appendChild(hintEl);
    panel.appendChild(grid);
    panel.appendChild(actions);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
  });
}

// One-off analysis of an arbitrary hand+deck (used by "Analyze a Hand").
// Runs in the worker on a separate token space so it never disturbs the
// live game's analysisResults/analysisPromise/token state. The game and
// pay table are parameters so a hand can be analyzed under any variant.
let adhocToken = 1000000000;
function analyzeHandAsync(h, d, gameKey = currentGame, rows = curPayRows(), bet = coinBet){
  const token = ++adhocToken;
  return new Promise(resolve => {
    try {
      evPending[token] = resolve;
      getEVWorker().postMessage({
        token, gameKey, rows, coinBet: bet,
        hand: h.slice(), deck: d.slice(),
      });
    } catch(err) {
      delete evPending[token];
      resolve(computeAllEVs(h.slice(), d.slice()));
    }
  });
}

  const applyToggleStyle = () => {
    if(!oddsMode){
      // currently showing payouts → button offers "Odds"
      toggleBtn.textContent = 'Odds';
      toggleBtn.style.cssText = [
        'font-family:Arial,Helvetica,sans-serif','font-size:13px','font-weight:bold',
        'letter-spacing:2px','text-transform:uppercase','padding:8px 22px',
        'background:linear-gradient(180deg,#1a7a3a,#0e4e24)',
        'border:2px solid #3cdc64','border-radius:8px',
        'color:#3cdc64','cursor:pointer','touch-action:manipulation',
      ].join(';');
    } else {
      // currently showing odds → button offers "Payouts"
      toggleBtn.textContent = 'Payouts';
      toggleBtn.style.cssText = [
        'font-family:Arial,Helvetica,sans-serif','font-size:13px','font-weight:bold',
        'letter-spacing:2px','text-transform:uppercase','padding:8px 22px',
        'background:linear-gradient(180deg,#d0d8e8,#a0aac0)',
        'border:2px solid #e0e8f8','border-radius:8px',
        'color:#0a1a3a','cursor:pointer','touch-action:manipulation',
      ].join(';');
    }
    // normalising a percentage is meaningless, so the scale toggle only
    // belongs on screen while payouts are showing
    betBtn.style.display = oddsMode ? 'none' : '';
  };

  // Scale toggle — money at the current bet, or per coin wagered
  const betBtn = document.createElement('button');
  const applyBetStyle = () => {
    betBtn.textContent = perCoin ? 'Current Bet' : 'Per Coin';
    betBtn.style.cssText = [
      'font-family:Arial,Helvetica,sans-serif','font-size:13px','font-weight:bold',
      'letter-spacing:2px','text-transform:uppercase','padding:8px 22px','border-radius:8px',
      'cursor:pointer','touch-action:manipulation',
      perCoin ? 'background:linear-gradient(180deg,#d0d8e8,#a0aac0);border:2px solid #e0e8f8;color:#0a1a3a'
              : 'background:linear-gradient(180deg,#7a5a00,#4a3600);border:2px solid #ccaa00;color:#ffee88',
    ].join(';');
  };
  applyBetStyle();
  betBtn.addEventListener('click', () => {
    perCoin = !perCoin;
    sfx.button();
    applyBetStyle();
    if(lastRanked) render(lastRanked);
  });

  applyToggleStyle();

  const closeBtn = document.createElement('button');
  closeBtn.textContent = 'Close';
  closeBtn.style.cssText = [
    'font-family:Arial,Helvetica,sans-serif',
    'font-size:13px','font-weight:bold','letter-spacing:2px',
    'text-transform:uppercase','padding:8px 28px',
    'background:linear-gradient(180deg,#2a4aaa,#1a2a7a)',
    'border:2px solid #5a7acc','border-radius:8px',
    'color:#fff','cursor:pointer','touch-action:manipulation',
  ].join(';');

  const close = () => { if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', e => { if(e.target===overlay) close(); });

  // ── Strategy strip: a few lines of the guide centred on this hand's
  // book play, toggled from the bottom bar ──────────────────
  // Header stays fixed; the whole list at the current level scrolls beneath
  // it, opened with the book line in view.
  // The whole strip is capped at a third of the viewport so the hold table
  // keeps the rest; the list scrolls inside whatever is left after the header.
  const stripWrap = document.createElement('div');
  stripWrap.style.cssText = 'flex-shrink:0;display:none;flex-direction:column;border-top:2px solid #2a4a9a;' +
                            'padding-top:6px;max-height:33vh;overflow:hidden;';
  const stripHead = document.createElement('div');
  stripHead.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 4px;flex-shrink:0;';
  const stripList = document.createElement('div');
  stripList.style.cssText = 'overflow-y:auto;flex:1;min-height:0;padding:0 4px;-webkit-overflow-scrolling:touch;';
  const stripWarn = document.createElement('div');
  stripWarn.style.cssText = 'font-size:11px;color:#ffcc66;padding:4px 8px 0;flex-shrink:0;display:none;';
  stripWrap.appendChild(stripHead);
  stripWrap.appendChild(stripList);
  stripWrap.appendChild(stripWarn);

  let stripOn = analyzeStripOn;      // remembered across openings
  let stripBook = null;              // book play shown, for the exception note
  const ptIdxFor = isCustom ? Math.min(gameState[gKey].payTableIdx, GAMES[gKey].payTables.length - 1) : payTableIdx;

  // "Exception" note: the analyzer's top hold isn't on the book line
  function updateStripWarn(){
    const show = stripOn && stripBook && lastRanked && !stripBook.masks.includes(lastRanked[0].mask);
    stripWarn.style.display = show ? '' : 'none';
    if(show) stripWarn.textContent = 'Exception: on this hand the analyzer\'s top-EV hold differs from the book line.';
  }

  function renderStrip(){
    stripWrap.style.display = stripOn ? 'flex' : 'none';
    if(!stripOn) return;
    const key = stratKeyFor(gKey, ptIdxFor);
    const cfg = STRAT_CFG[gKey];
    stripHead.innerHTML = '';
    stripWarn.style.display = 'none';
    if(!key || !cfg){
      stripList.innerHTML = '<div style="text-align:center;color:#8899bb;font-size:12px;padding:8px">' +
        'No strategy guide for this pay table yet.</div>';
      return;
    }
    stripList.innerHTML = '<div style="text-align:center;color:#f0c040;font-size:12px;padding:8px">Loading strategy…</div>';
    loadStrategy(key).then(strat => {
      if(!stripOn) return;
      if(!strat){ stripList.innerHTML = '<div style="text-align:center;color:#ff8080;font-size:12px;padding:8px">Strategy unavailable.</div>'; return; }
      const book = bookPlay(aHand, strat, cfg);
      const list = stratLines(strat);
      stripBook = book;

      const ptLabel = GAMES[gKey].payTables[ptIdxFor].label;
      stripHead.innerHTML = `<span style="font-size:11px;font-weight:bold;letter-spacing:1px;color:#3acccc">` +
                            `STRATEGY (${stratLevelName().toUpperCase()}) — ${ptLabel}</span>`;
      const more = document.createElement('span');
      more.textContent = 'Full screen ›';
      more.style.cssText = 'font-size:11px;color:#aaffff;cursor:pointer;';
      more.addEventListener('click', () => showStrategy(book && book.id));
      stripHead.appendChild(more);

      stripList.innerHTML = '';
      let bookRow = null;
      list.forEach((line, i) => {
        const isBook = !!book && i === book.rank;
        const r = document.createElement('div');
        r.style.cssText = [
          'display:flex','align-items:center','gap:8px','padding:4px 6px','border-radius:5px',
          'font-size:13px',
          isBook ? 'background:rgba(240,192,64,0.20);color:#f0c040;font-weight:bold'
                 : (i % 2 ? 'background:rgba(255,255,255,0.03);color:#c0c8d8' : 'color:#c0c8d8'),
        ].join(';');
        r.innerHTML = `<span style="width:22px;text-align:right;color:#f0c040;font-weight:bold">${i + 1}</span>` +
                      `<span style="flex:1">${line.label}</span>` +
                      (isBook ? '<span style="font-size:11px;letter-spacing:1px">← PLAY THIS</span>' : '');
        if(isBook) bookRow = r;
        stripList.appendChild(r);
      });
      // open with the book line roughly centred in the scroll window
      if(bookRow){
        stripList.scrollTop = Math.max(0, bookRow.offsetTop - stripList.offsetTop - stripList.clientHeight / 2 + bookRow.offsetHeight / 2);
      }
      updateStripWarn();
    });
  }

  const stratToggle = document.createElement('button');
  const styleStratToggle = () => {
    stratToggle.textContent = 'Strategy';
    stratToggle.style.cssText = [
      'font-family:Arial,Helvetica,sans-serif','font-size:13px','font-weight:bold',
      'letter-spacing:2px','text-transform:uppercase','padding:8px 22px','border-radius:8px',
      'cursor:pointer','touch-action:manipulation',
      stripOn ? 'background:linear-gradient(180deg,#1a6a6a,#0e4444);border:2px solid #3acccc;color:#aaffff'
              : 'background:linear-gradient(180deg,#24345a,#16223d);border:2px solid #3a5aaa;color:#8fa8c8',
    ].join(';');
  };
  styleStratToggle();
  stratToggle.addEventListener('click', () => {
    stripOn = !stripOn;
    analyzeStripOn = stripOn;      // remembered for next time
    saveState();
    sfx.button();
    styleStratToggle();
    renderStrip();
  });

  // Back (custom hands only): return to the picker with the same cards
  if(isCustom && typeof opts.onBack === 'function'){
    const backBtn = document.createElement('button');
    backBtn.textContent = 'Back';
    backBtn.style.cssText = [
      'font-family:Arial,Helvetica,sans-serif','font-size:13px','font-weight:bold',
      'letter-spacing:2px','text-transform:uppercase','padding:8px 22px',
      'background:linear-gradient(180deg,#3a3a3a,#1a1a1a)','border:2px solid #666',
      'border-radius:8px','color:#ccc','cursor:pointer','touch-action:manipulation',
    ].join(';');
    backBtn.addEventListener('click', () => { sfx.button(); close(); opts.onBack(); });
    bottomBar.appendChild(backBtn);
  }
  bottomBar.appendChild(toggleBtn);
  bottomBar.appendChild(betBtn);
  bottomBar.appendChild(stratToggle);
  bottomBar.appendChild(closeBtn);

  panel.appendChild(title);
  panel.appendChild(handLine);
  panel.appendChild(scroll);
  panel.appendChild(stripWrap);      // strategy strip, above the buttons
  panel.appendChild(bottomBar);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  // ── Render function — redraws the table in current mode ────
  let lastRanked = null;
  renderStrip();                     // strip opens in its remembered state

  function render(ranked) {
    lastRanked = ranked;
    updateStripWarn();
    // All 32 hold options, best first — the table area scrolls
    const shown      = ranked.map((c, i) => ({ combo: c, rank: i + 1 }));
    const playerRank = ranked.findIndex(r => r.mask === playerMask) + 1;

    // ── Cell helpers ──────────────────────────────────────
    const thStyle = (extra='') =>
      `padding:5px 3px;border-bottom:2px solid #2a4a9a;` +
      `font-weight:bold;font-size:17px;white-space:nowrap;text-align:right;` +
      (oddsMode ? 'color:#3cdc64;' : 'color:#f0c040;') + extra;

    // Payout cell (dollar amounts)
    const tdPay = (val, bold) => {
      const td = document.createElement('td');
      td.style.cssText = `text-align:right;padding:5px 3px;font-size:17px;` +
        `color:${val > 0 ? '#e0e8f8' : '#3a4a6a'};` +
        (bold ? 'font-weight:bold;color:#f0c040;' : '');
      if(val <= 0){
        td.textContent = '—';
      } else if(perCoin){
        // per coin wagered — a bare ratio, no currency
        const d = val / coinBet;
        td.textContent = d >= 100 ? d.toFixed(0)
                       : d >= 10  ? d.toFixed(1)
                       : d >= 1   ? d.toFixed(2)
                       :            d.toFixed(3);
      } else {
        const d = +(val * denom).toFixed(2);
        td.textContent = d < 1 ? '$' + d.toFixed(2)
                       : Number.isInteger(d) ? '$' + d
                       : '$' + d.toFixed(2);
      }
      return td;
    };

    // Odds cell (percentage)
    const tdOdds = (val, bold) => {
      const td = document.createElement('td');
      td.style.cssText = `text-align:right;padding:5px 3px;font-size:17px;` +
        `color:${val > 0 ? '#3cdc64' : '#1a3a1a'};` +
        (bold ? 'font-weight:bold;' : '');
      if(val <= 0){
        td.textContent = '—';
      } else {
        const pct = val * 100;
        td.textContent = pct < 0.001 ? pct.toFixed(4) + '%'
                       : pct < 0.1   ? pct.toFixed(3) + '%'
                       : pct < 10    ? pct.toFixed(2) + '%'
                       :               pct.toFixed(1) + '%';
      }
      return td;
    };

    const tdCell = oddsMode
      ? (val, bold) => tdOdds(val, bold)
      : (val, bold) => tdPay(val, bold);

    // ── Table ─────────────────────────────────────────────
    const tbl = document.createElement('table');
    tbl.style.cssText = 'border-collapse:collapse;width:100%;min-width:600px;';

    const thead = tbl.createTHead();
    const hr    = thead.insertRow();
    const addTH = (text, extra='') => {
      const th = document.createElement('th');
      th.textContent = text;
      th.style.cssText = thStyle(extra);
      hr.appendChild(th);
    };
    addTH('#',            'width:24px;text-align:center;');
    addTH('Hold',         'text-align:left;width:1%;');   // hugs its content
    addTH('Total',        'border-right:1px solid #2a4a9a;');
    HAND_COLS.forEach(c => addTH(c.label));

    const tbody = tbl.createTBody();
    shown.forEach(({combo, rank}, ri) => {
      const isPlayer = combo.mask === playerMask;
      const row = tbody.insertRow();
      row.style.cssText = isPlayer
        ? 'background:rgba(240,192,64,0.13);'
        : (ri%2===0 ? '' : 'background:rgba(255,255,255,0.03);');
      // # cell — actual rank among all 32 holds
      const rnkTd = row.insertCell();
      rnkTd.textContent = rank;
      rnkTd.style.cssText = 'text-align:center;padding:5px 4px;font-weight:bold;color:#f0c040;font-size:18px;';

      // Hold cell — the held cards as compact chips ("Draw 5 new" for none);
      // same row height as plain text so the table stays dense
      const holdTd = row.insertCell();
      holdTd.style.cssText = `padding:4px 6px 4px 3px;white-space:nowrap;width:1%;` +
        (isPlayer ? 'color:#f0c040;font-weight:bold;' : 'color:#c0c8d8;');
      const holdWrap = document.createElement('div');
      holdWrap.style.cssText = 'display:flex;align-items:center;gap:2px;';
      if(combo.mask === 0){
        const t = document.createElement('span');
        t.style.cssText = 'font-size:16px;';
        t.textContent = 'Draw 5 new';
        holdWrap.appendChild(t);
      } else {
        combo.heldCards.forEach(c => holdWrap.appendChild(cardChipEl(c, 15)));
      }
      if(isPlayer){
        const you = document.createElement('span');
        you.style.cssText = 'font-size:13px;margin-left:6px;';
        you.textContent = '← you';
        holdWrap.appendChild(you);
      }
      holdTd.appendChild(holdWrap);

      // Total cell
      const totVal = oddsMode
        ? HAND_COLS.reduce((s, c) => s + combo.handOdds[c.idx], 0)
        : combo.ev;
      const totTd = tdCell(totVal, true);
      totTd.style.borderRight = '1px solid #2a4a9a';
      row.appendChild(totTd);

      // Per-hand columns
      HAND_COLS.forEach(c => row.appendChild(
        tdCell(oddsMode ? combo.handOdds[c.idx] : combo.handEV[c.idx], false)
      ));
    });

    // Footer
    const footer = document.createElement('div');
    footer.style.cssText = 'text-align:center;font-size:15px;color:#8899bb;padding:6px 0 2px;';
    if(isCustom){
      footer.textContent = 'Hypothetical hand — best holds ranked from all 32 options';
    } else if(playerRank === 1){
      footer.textContent = '✓ Optimal hold selected';
      footer.style.color = '#3cdc64';
    } else {
      footer.textContent = `Your hold ranks #${playerRank} of 32`;
    }

    content.innerHTML = '';
    content.appendChild(tbl);
    content.appendChild(footer);
  }

  // Toggle handler — flips mode and rerenders without recomputing
  toggleBtn.addEventListener('click', () => {
    oddsMode = !oddsMode;
    applyToggleStyle();
    if(lastRanked) render(lastRanked);
  });

  // Compute in the worker on button press; modal renders (and stays
  // responsive) while it runs. Reuses the trainer's result if ready.
  if(isCustom){
    analyzeHandAsync(customHand, customDeck, gKey, rows).then(results => {
      if(overlay.parentNode) render(results);
    });
  } else if(analysisResults){
    setTimeout(() => render(analysisResults), 30);
  } else {
    const p = analysisPromise || startAnalysisAsync();
    const token = analysisToken;   // capture AFTER starting (start bumps it)
    p.then(results => {
      if(overlay.parentNode && token === analysisToken) render(results);
    });
  }
}

// ════════════════════════════════════════════════════════════
//  NON-OPTIMAL PLAYS VIEWER
//  Last 8 suboptimal plays for the current game, three columns each:
//  the dealt board (glow = cards you SHOULD have held), your actual
//  result, and the optimal-hold result — with hand names and payouts.
// ════════════════════════════════════════════════════════════
function showSubPlays(){
  sfx.button();
  const rows = curPayRows();
  const catOf = name => rows.findIndex(r => r.name === name);

  const overlay = document.createElement('div');
  overlay.style.cssText = [
    'position:fixed','inset:0','z-index:10000',
    'background:rgba(0,5,25,0.92)',
    'display:flex','align-items:center','justify-content:center',
    'font-family:Arial,Helvetica,sans-serif',
  ].join(';');

  const panel = document.createElement('div');
  panel.style.cssText = [
    'background:linear-gradient(180deg,#0d2255 0%,#091840 100%)',
    'border:2px solid #2a4a9a','border-radius:14px',
    'box-shadow:0 0 30px rgba(20,60,180,0.6)',
    'padding:16px 20px','width:min(860px,97vw)',
    'max-height:92vh','overflow-y:auto',
    'display:flex','flex-direction:column','gap:12px',
  ].join(';');

  const title = document.createElement('div');
  title.style.cssText = [
    'text-align:center','font-size:15px','font-weight:bold',
    'color:#f0c040','letter-spacing:3px','text-transform:uppercase',
    'text-shadow:0 0 8px rgba(240,192,64,0.5)',
  ].join(';');
  title.textContent = curGame().name + ' — Non-Optimal Plays';
  title.appendChild(betaTag());
  panel.appendChild(title);

  // A 5-card strip: heldMask marks HELD labels, glowIdxs get the gold glow
  // (mini cards come from the shared miniCardEl — larger rank/suit text)
  function strip(cards, heldMask, glowIdxs){
    const s = document.createElement('div');
    s.style.cssText = 'display:flex;gap:3px;';
    cards.forEach((c, i) => s.appendChild(
      miniCardEl(c, { held: (heldMask & (1<<i)) ? 'HELD' : '', glow: glowIdxs.includes(i) })
    ));
    return s;
  }

  // A column: small header above the strip, result caption below.
  // Rows flex-wrap, so on narrow screens the three columns stack.
  function column(header, headerColor, strips, caption, captionColor){
    const col = document.createElement('div');
    col.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px;';
    const h = document.createElement('div');
    h.style.cssText = `font-size:10px;font-weight:bold;letter-spacing:1px;color:${headerColor};`;
    h.textContent = header;
    col.appendChild(h);
    col.appendChild(strips);
    const cap = document.createElement('div');
    cap.style.cssText = `font-size:11px;font-weight:bold;letter-spacing:0.5px;min-height:14px;color:${captionColor};text-align:center;`;
    cap.textContent = caption;
    col.appendChild(cap);
    return col;
  }

  if(subPlays.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;color:#8899bb;font-size:14px;padding:24px 0;';
    empty.textContent = 'No non-optimal plays recorded yet for this game — nice!';
    panel.appendChild(empty);
  } else {
    [...subPlays].reverse().forEach(rec => {
      const row = document.createElement('div');
      row.style.cssText = [
        'display:flex','flex-wrap:wrap','justify-content:center','align-items:flex-start',
        'gap:8px 20px','padding:8px 4px','border-top:1px solid #1a3a7a',
      ].join(';');

      // Col 1: dealt board — HELD = what you held, glow = what you should
      // have held. Tapping it opens the full EV analysis for that hand.
      const glowPre = [];
      for(let i=0;i<5;i++) if(rec.oheld & (1<<i)) glowPre.push(i);
      const dealtCol = column(
        `${rec.n ? 'HAND #' + rec.n + ' ' : ''}DEALT — glow = best hold`, '#f0c040',
        strip(rec.pre, rec.held, glowPre), 'tap to analyze', '#8899bb'
      );
      dealtCol.style.cursor = 'pointer';
      dealtCol.addEventListener('click', () => {
        sfx.button();
        const remaining = fullDeckFor().filter(c =>
          !rec.pre.some(x => x.rank === c.rank && x.suit === c.suit));
        showAnalysis(rec.pre.slice(), remaining);
      });
      row.appendChild(dealtCol);

      // Col 2: your actual result
      const aCat  = catOf(rec.res);
      const aGlow = rec.win > 0 && aCat >= 0 ? curGame().winCards(aCat, rec.post) : [];
      row.appendChild(column(
        'YOUR RESULT', '#e0e8f8',
        strip(rec.post, rec.held, aGlow),
        `${rec.res}  ${rec.win > 0 ? '+' + rec.win : '0'}`,
        rec.win > 0 ? '#f0c040' : '#8899bb'
      ));

      // Col 3: optimal-hold result
      const oCat  = catOf(rec.ores);
      const oGlow = rec.owin > 0 && oCat >= 0 ? curGame().winCards(oCat, rec.opost) : [];
      row.appendChild(column(
        'OPTIMAL RESULT', '#38b6ff',
        strip(rec.opost, rec.oheld, oGlow),
        `${rec.ores}  ${rec.owin > 0 ? '+' + rec.owin : '0'}`,
        rec.owin > 0 ? '#38b6ff' : '#8899bb'
      ));

      panel.appendChild(row);
    });
  }

  const closeBtn = document.createElement('button');
  closeBtn.textContent = 'Close';
  closeBtn.style.cssText = [
    'align-self:center','font-family:Arial,Helvetica,sans-serif','font-size:13px',
    'font-weight:bold','letter-spacing:2px','text-transform:uppercase','padding:8px 28px',
    'background:linear-gradient(180deg,#2a4aaa,#1a2a7a)','border:2px solid #5a7acc',
    'border-radius:8px','color:#fff','cursor:pointer','touch-action:manipulation',
  ].join(';');
  const close = () => { if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', e => { if(e.target === overlay) close(); });

  panel.appendChild(closeBtn);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}

// ════════════════════════════════════════════════════════════
//  STRATEGY GUIDE SCREEN
//  The ordered hold list for the current pay table. highlightId scrolls to
//  and highlights one line (used when opened from the Analyze screen).
// ════════════════════════════════════════════════════════════
function showStrategy(highlightId){
  sfx.button();
  const key = stratKeyFor();

  const overlay = document.createElement('div');
  overlay.style.cssText = [
    'position:fixed','inset:0','z-index:10002',
    'background:rgba(0,5,25,0.92)',
    'display:flex','align-items:center','justify-content:center',
    'font-family:Arial,Helvetica,sans-serif',
  ].join(';');
  const panel = document.createElement('div');
  panel.style.cssText = [
    'background:linear-gradient(180deg,#0d2255 0%,#091840 100%)',
    'border:2px solid #2a4a9a','border-radius:14px',
    'box-shadow:0 0 30px rgba(20,60,180,0.6)',
    'padding:16px','width:min(560px,95vw)',
    'max-height:92vh','display:flex','flex-direction:column','gap:10px',
  ].join(';');

  const title = document.createElement('div');
  title.style.cssText = [
    'text-align:center','font-size:15px','font-weight:bold','color:#f0c040',
    'letter-spacing:2px','text-transform:uppercase','flex-shrink:0',
  ].join(';');
  title.textContent = 'Strategy — ' + curGame().name;
  title.appendChild(betaTag());

  const sub = document.createElement('div');
  sub.style.cssText = 'text-align:center;font-size:11px;color:#8899bb;flex-shrink:0;';

  const body = document.createElement('div');
  body.style.cssText = 'overflow-y:auto;flex:1;';

  const levelRow = document.createElement('div');
  levelRow.style.cssText = 'display:flex;gap:6px;justify-content:center;flex-wrap:wrap;flex-shrink:0;';

  const closeBtn = document.createElement('button');
  closeBtn.textContent = 'Close';
  closeBtn.style.cssText = [
    'font-family:Arial,Helvetica,sans-serif','font-size:13px',
    'font-weight:bold','letter-spacing:2px','text-transform:uppercase','padding:8px 28px',
    'background:linear-gradient(180deg,#2a4aaa,#1a2a7a)','border:2px solid #5a7acc',
    'border-radius:8px','color:#fff','cursor:pointer','touch-action:manipulation','flex-shrink:0',
  ].join(';');
  const close = () => { if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', e => { if(e.target === overlay) close(); });

  // Save the list being viewed as a plain text file
  const dlBtn = document.createElement('button');
  dlBtn.textContent = 'Download';
  dlBtn.style.cssText = [
    'font-family:Arial,Helvetica,sans-serif','font-size:13px','font-weight:bold',
    'letter-spacing:2px','text-transform:uppercase','padding:8px 22px',
    'background:linear-gradient(180deg,#1a6a6a,#0e4444)','border:2px solid #3acccc',
    'border-radius:8px','color:#aaffff','cursor:pointer','touch-action:manipulation','flex-shrink:0',
  ].join(';');
  dlBtn.style.display = 'none';                 // shown once a strategy loads
  let downloadFor = null;                       // set by render()
  dlBtn.addEventListener('click', () => { sfx.button(); if(downloadFor) downloadFor(); });

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;justify-content:center;gap:12px;flex-shrink:0;';
  btnRow.appendChild(dlBtn);
  btnRow.appendChild(closeBtn);

  panel.appendChild(title);
  panel.appendChild(sub);
  panel.appendChild(levelRow);
  panel.appendChild(body);
  panel.appendChild(btnRow);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  if(!key){
    sub.textContent = curGame().payTables[payTableIdx].label;
    body.innerHTML = '<div style="text-align:center;color:#8899bb;font-size:13px;padding:26px 10px;line-height:1.6">' +
      'No strategy guide for this pay table yet.<br><br>' +
      'Guides are generated per pay table; this one hasn\'t been generated yet.</div>';
    return;
  }

  body.innerHTML = '<div style="text-align:center;color:#f0c040;font-size:13px;padding:26px">Loading strategy…</div>';
  loadStrategy(key).then(strat => {
    if(!overlay.parentNode) return;
    if(!strat){
      body.innerHTML = '<div style="text-align:center;color:#ff8080;font-size:13px;padding:26px">Strategy file could not be loaded.</div>';
      return;
    }
    const render = () => {
      const list = stratLines(strat, stratLevel);
      const ret  = stratReturn(strat, stratLevel);
      const ptLabel = curGame().payTables[payTableIdx].label;
      sub.textContent = `${ptLabel}  ·  ${list.length} lines  ·  ` +
                        `${(ret*100).toFixed(2)}% return  (optimal ${(strat.optimalReturn*100).toFixed(2)}%)`;

      // Plain-text export of exactly the list on screen
      dlBtn.style.display = '';
      downloadFor = () => {
        const w = 64;
        const lines = [
          `${curGame().name} — ${ptLabel}`,
          `${stratLevelName(stratLevel)} strategy — ${list.length} lines`,
          `Return with this list: ${(ret*100).toFixed(4)}%   (optimal play: ${(strat.optimalReturn*100).toFixed(4)}%)`,
          `Assumes max coins (5). Generated ${strat.generated}.`,
          '='.repeat(w), '',
          'Play the FIRST line that matches your hand.', '',
        ];
        list.forEach((l, i) => lines.push(`${String(i+1).padStart(3)}. ${l.label}`));
        // strat.neverPlayed is deliberately NOT exported: it lists patterns the
        // ordering never selects, which reads as advice but isn't — the entries
        // are either already covered by a line above or unreachable behind one.
        lines.push('', '-'.repeat(w),
          'Exceptions: hands where the top-EV hold differs from this list are',
          'shown on the Analyze screen when the strategy strip is open.', '');
        const name = `${curGame().name} ${ptLabel} ${stratLevelName(stratLevel)}`
          .replace(/[^\w.-]+/g, '-').replace(/^-|-$/g, '');
        const url = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' }));
        const a = document.createElement('a');
        a.href = url; a.download = name + '.txt';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };

      // level buttons — the chosen level is shared with the Analyze strip
      // and (when "Judge Holds By" is Strategy) the hold trainer
      levelRow.innerHTML = '';
      STRAT_LEVELS.filter(([val]) => val === 'full' || strat.simplified[val]).forEach(([val, label]) => {
        const b = document.createElement('button');
        b.textContent = label;
        const on = stratLevel === val;
        b.style.cssText = [
          'font-family:Arial,Helvetica,sans-serif','font-size:11px','font-weight:bold',
          'letter-spacing:1px','text-transform:uppercase','padding:6px 12px','border-radius:6px',
          'cursor:pointer','touch-action:manipulation',
          on ? 'background:linear-gradient(180deg,#c89a20,#a07a10);border:2px solid #f0c040;color:#000'
             : 'background:#1a2a60;border:2px solid #3a5aaa;color:#c0c8d8',
        ].join(';');
        b.addEventListener('click', () => { stratLevel = val; saveState(); sfx.button(); render(); });
        levelRow.appendChild(b);
      });

      // the ordered list
      body.innerHTML = '';
      const tbl = document.createElement('table');
      tbl.style.cssText = 'border-collapse:collapse;width:100%;';
      let hit = null;
      list.forEach((line, i) => {
        const row = tbl.insertRow();
        const isHit = highlightId && line.ids.includes(highlightId);
        if(isHit) hit = row;
        row.style.cssText = isHit
          ? 'background:rgba(240,192,64,0.18);'
          : (i % 2 ? 'background:rgba(255,255,255,0.03);' : '');
        const n = row.insertCell();
        n.textContent = i + 1;
        n.style.cssText = 'width:28px;text-align:center;padding:6px 4px;font-weight:bold;font-size:14px;color:#f0c040;';
        const l = row.insertCell();
        l.textContent = line.label;
        l.style.cssText = 'padding:6px 4px;font-size:14px;' +
          (isHit ? 'color:#f0c040;font-weight:bold;' : 'color:#e0e8f8;');
      });
      body.appendChild(tbl);

      // footnotes
      const note = document.createElement('div');
      note.style.cssText = 'font-size:11px;color:#8899bb;padding:10px 4px 2px;line-height:1.5;';
      note.innerHTML = 'Play the <b>first</b> line that matches your hand.  ' +
        'Assumes max coins (5).' +
        (strat.exceptions.length ? `<br>${strat.exceptions.length} rare exception${strat.exceptions.length!==1?'s':''} not shown.` : '');
      body.appendChild(note);

      if(hit) setTimeout(() => hit.scrollIntoView({ block:'center' }), 30);
    };
    render();
  });
}

// ════════════════════════════════════════════════════════════
//  ANALYZE-A-HAND PICKER
//  Ten quick presses: rank then suit, five times over. Feeds the
//  chosen hand into the same EV analysis screen as the Analyze button.
// ════════════════════════════════════════════════════════════
// initCards/initGame: re-open with a previous selection (Back from analysis)
function showHandPicker(initCards, initGame){
  sfx.button();
  const cards = (Array.isArray(initCards) ? initCards : []).map(c => ({ ...c }));
  let pendingRank = null;
  let gameKey = (initGame && GAMES[initGame]) ? initGame : currentGame;

  const overlay = document.createElement('div');
  overlay.style.cssText = [
    'position:fixed','inset:0','z-index:10000',
    'background:rgba(0,5,25,0.9)',
    'display:flex','align-items:center','justify-content:center',
    'font-family:Arial,Helvetica,sans-serif',
  ].join(';');

  const panel = document.createElement('div');
  panel.style.cssText = [
    'background:linear-gradient(180deg,#0d2255 0%,#091840 100%)',
    'border:2px solid #2a4a9a','border-radius:14px',
    'box-shadow:0 0 30px rgba(20,60,180,0.6)',
    'padding:18px 22px','width:min(520px,94vw)',
    'max-height:92vh','overflow-y:auto',
    'display:flex','flex-direction:column','gap:14px','align-items:center',
  ].join(';');

  const title = document.createElement('div');
  title.style.cssText = 'font-size:16px;font-weight:bold;color:#f0c040;letter-spacing:3px;text-transform:uppercase;';
  title.textContent = 'Analyze a Hand';

  const hint = document.createElement('div');
  hint.style.cssText = 'font-size:11px;color:#8899bb;text-align:center;';
  hint.textContent = 'Tap a rank, then a suit — five times.';

  // ── Game rules selector (defaults to the current game) ──
  const gameRow = document.createElement('div');
  gameRow.style.cssText = 'display:flex;align-items:center;gap:8px;';
  const gameLbl = document.createElement('div');
  gameLbl.style.cssText = 'font-size:12px;font-weight:bold;color:#c0c8d8;letter-spacing:1px;';
  gameLbl.textContent = 'Rules:';
  const gameSel = document.createElement('select');
  gameSel.style.cssText = [
    'font-family:Arial,Helvetica,sans-serif','font-size:14px','font-weight:bold',
    'padding:7px 10px','background:#0a1a40','border:2px solid #3a5aaa',
    'border-radius:6px','color:#f0c040','max-width:260px',
  ].join(';');
  GAME_KEYS.forEach(k => {
    const o = document.createElement('option');
    o.value = k;
    o.textContent = GAMES[k].name;
    gameSel.appendChild(o);
  });
  gameSel.value = gameKey;
  gameSel.addEventListener('change', () => {
    gameKey = gameSel.value;
    // Joker only exists in joker games — drop it if the new rules lack one
    if(!GAMES[gameKey].joker){
      for(let i = cards.length - 1; i >= 0; i--) if(cards[i].joker) cards.splice(i, 1);
    }
    rankBtns.JOKER.style.display = GAMES[gameKey].joker ? '' : 'none';
    status.textContent = '';
    sfx.button();
    refresh();
  });
  gameRow.appendChild(gameLbl);
  gameRow.appendChild(gameSel);

  // ── Five card slots ─────────────────────────────────────
  const slotsRow = document.createElement('div');
  slotsRow.style.cssText = 'display:flex;gap:8px;';
  const slots = [];
  for(let i=0;i<5;i++){
    const s = document.createElement('div');
    s.style.cssText = [
      'width:58px','height:78px','border:2px dashed #3a5aaa','border-radius:8px',
      'background:#0a1a40','display:flex','align-items:center','justify-content:center',
      'font-size:20px','font-weight:bold','color:#c0c8d8',
    ].join(';');
    slots.push(s);
    slotsRow.appendChild(s);
  }

  const status = document.createElement('div');
  status.style.cssText = 'font-size:12px;color:#ff8080;min-height:15px;';

  // ── Rank buttons ────────────────────────────────────────
  const rankRow = document.createElement('div');
  rankRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:5px;justify-content:center;';
  const rankBtns = {};
  const mkBtn = (label, wide) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = [
      'font-family:Arial,Helvetica,sans-serif','font-size:15px','font-weight:bold',
      `min-width:${wide ? 64 : 40}px`,'padding:9px 4px',
      'background:#1a2a60','border:2px solid #3a5aaa','border-radius:7px',
      'color:#e0e8f8','cursor:pointer','touch-action:manipulation',
    ].join(';');
    return b;
  };
  RANKS.forEach(r => {
    const b = mkBtn(r);
    b.addEventListener('click', () => {
      if(cards.length >= 5) return;
      pendingRank = r;
      sfx.hold();
      refresh();
    });
    rankBtns[r] = b;
    rankRow.appendChild(b);
  });
  {
    // JOKER key is always built; shown only when the selected rules use one
    const b = mkBtn('JOKER', true);
    b.style.display = GAMES[gameKey].joker ? '' : 'none';
    b.addEventListener('click', () => {
      if(cards.length >= 5) return;
      if(cards.some(c => c.joker)){ status.textContent = 'The joker is already in the hand.'; return; }
      cards.push({ rank:'JOKER', suit:'★', joker:true });
      pendingRank = null;
      status.textContent = '';
      sfx.hold();
      refresh();
    });
    rankBtns.JOKER = b;
    rankRow.appendChild(b);
  }

  // ── Suit buttons ────────────────────────────────────────
  const suitRow = document.createElement('div');
  suitRow.style.cssText = 'display:flex;gap:8px;justify-content:center;';
  const suitBtns = [];
  SUITS.forEach(s => {
    const b = mkBtn(s, true);
    b.style.fontSize = '26px';
    b.style.color = SUIT_COLOR[s] === 'red' ? '#ff6060' : '#e0e8f8';
    b.addEventListener('click', () => {
      if(!pendingRank || cards.length >= 5) return;
      if(cards.some(c => c.rank === pendingRank && c.suit === s)){
        status.textContent = pendingRank + s + ' is already in the hand.';
        sfx.thump();
        return;
      }
      cards.push({ rank: pendingRank, suit: s });
      pendingRank = null;
      status.textContent = '';
      sfx.hold();
      refresh();
    });
    suitBtns.push(b);
    suitRow.appendChild(b);
  });

  // ── Action buttons ──────────────────────────────────────
  const actRow = document.createElement('div');
  actRow.style.cssText = 'display:flex;gap:10px;justify-content:center;flex-wrap:wrap;';
  const mkAct = (label, bg, border, color) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = [
      'font-family:Arial,Helvetica,sans-serif','font-size:13px','font-weight:bold',
      'letter-spacing:1px','text-transform:uppercase','padding:9px 20px',
      `background:${bg}`,`border:2px solid ${border}`,'border-radius:8px',
      `color:${color}`,'cursor:pointer','touch-action:manipulation',
    ].join(';');
    return b;
  };
  const backBtn    = mkAct('Back','linear-gradient(180deg,#3a3a3a,#1a1a1a)','#666','#ccc');
  const analyzeBtn = mkAct('Analyze','linear-gradient(180deg,#7a6a00,#4a4000)','#ccaa00','#ffee88');
  const cancelBtn  = mkAct('Cancel','linear-gradient(180deg,#6a1a1a,#4a0a0a)','#cc4444','#ffaaaa');

  const close = () => { if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };

  backBtn.addEventListener('click', () => {
    if(pendingRank) pendingRank = null;
    else cards.pop();
    status.textContent = '';
    refresh();
  });
  cancelBtn.addEventListener('click', close);
  overlay.addEventListener('click', e => { if(e.target === overlay) close(); });

  analyzeBtn.addEventListener('click', () => {
    if(cards.length !== 5) return;
    const remaining = fullDeckFor(gameKey).filter(c =>
      !cards.some(x => x.rank === c.rank && x.suit === c.suit));
    const chosen = cards.slice();
    close();
    // Back returns here with the same cards and rules pre-selected
    showAnalysis(chosen, remaining, {
      gameKey,
      onBack: () => showHandPicker(chosen, gameKey),
    });
  });

  // ── State refresh ───────────────────────────────────────
  function refresh(){
    slots.forEach((s, i) => {
      if(cards[i]){
        const c = cards[i];
        s.textContent = c.joker ? '🃏' : c.rank + '\n' + c.suit;
        s.innerHTML = c.joker
          ? '<span style="font-size:30px">★</span>'
          : `<span style="color:${SUIT_COLOR[c.suit]==='red' ? '#ff6060' : '#fff'}">${c.rank}<br>${c.suit}</span>`;
        s.style.border = '2px solid #f0c040';
      } else if(i === cards.length && pendingRank){
        s.innerHTML = `<span style="color:#f0c040">${pendingRank}<br>?</span>`;
        s.style.border = '2px dashed #f0c040';
      } else {
        s.innerHTML = '';
        s.style.border = '2px dashed #3a5aaa';
      }
    });
    Object.entries(rankBtns).forEach(([r, b]) => {
      const active = r === pendingRank;
      b.style.background  = active ? 'linear-gradient(180deg,#c89a20,#a07a10)' : '#1a2a60';
      b.style.color       = active ? '#000' : (r === 'JOKER' ? '#ffd780' : '#e0e8f8');
      b.style.borderColor = active ? '#f0c040' : '#3a5aaa';
      b.disabled = cards.length >= 5;
      b.style.opacity = cards.length >= 5 ? 0.4 : 1;
    });
    suitBtns.forEach(b => {
      const usable = !!pendingRank && cards.length < 5;
      b.disabled = !usable;
      b.style.opacity = usable ? 1 : 0.35;
    });
    analyzeBtn.disabled = cards.length !== 5;
    analyzeBtn.style.opacity = cards.length === 5 ? 1 : 0.4;
  }
  refresh();

  actRow.appendChild(backBtn);
  actRow.appendChild(analyzeBtn);
  actRow.appendChild(cancelBtn);
  panel.appendChild(title);
  panel.appendChild(hint);
  panel.appendChild(gameRow);
  panel.appendChild(slotsRow);
  panel.appendChild(status);
  panel.appendChild(rankRow);
  panel.appendChild(suitRow);
  panel.appendChild(actRow);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}

// ════════════════════════════════════════════════════════════
//  CUSTOM PAY TABLE EDITOR
//  Every hand of the current game listed with an editable per-coin
//  payout, pre-filled from the selected table. Saved per game (max 3)
//  and offered everywhere pay tables appear, including graph compares.
// ════════════════════════════════════════════════════════════
function showCustomEditor(onSaved){
  sfx.button();
  const gs   = gameState[currentGame];
  const base = GAMES[currentGame]._builtin[0].rows;
  const cur  = curPayRows();
  const curTable = curGame().payTables[payTableIdx];

  const overlay = document.createElement('div');
  overlay.style.cssText = [
    'position:fixed','inset:0','z-index:10000',
    'background:rgba(0,5,25,0.9)',
    'display:flex','align-items:center','justify-content:center',
    'font-family:Arial,Helvetica,sans-serif',
  ].join(';');

  const panel = document.createElement('div');
  panel.style.cssText = [
    'background:linear-gradient(180deg,#0d2255 0%,#091840 100%)',
    'border:2px solid #2a4a9a','border-radius:14px',
    'box-shadow:0 0 30px rgba(20,60,180,0.6)',
    'padding:18px 24px','width:min(420px,94vw)',
    'max-height:92vh','overflow-y:auto',
    'display:flex','flex-direction:column','gap:10px',
  ].join(';');

  const title = document.createElement('div');
  title.style.cssText = 'text-align:center;font-size:15px;font-weight:bold;color:#f0c040;letter-spacing:2px;text-transform:uppercase;';
  title.textContent = 'Custom Pay Table — ' + curGame().name;
  panel.appendChild(title);

  // Name field — editing an existing custom pre-fills its name
  const nameRow = document.createElement('div');
  nameRow.style.cssText = 'display:flex;align-items:center;gap:8px;';
  const nameLbl = document.createElement('div');
  nameLbl.style.cssText = 'font-size:13px;font-weight:bold;color:#c0c8d8;';
  nameLbl.textContent = 'Name:';
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.maxLength = 24;
  nameInput.style.cssText = [
    'flex:1','padding:7px 10px','font-size:14px','font-weight:bold',
    'background:#0a1a40','border:2px solid #3a5aaa','border-radius:6px','color:#fff',
  ].join(';');
  nameInput.value = curTable.custom
    ? curTable.label.replace(/^★ /, '')
    : 'Custom ' + ((gs.customTables || []).length + 1);
  nameRow.appendChild(nameLbl);
  nameRow.appendChild(nameInput);
  panel.appendChild(nameRow);

  // One editable per-coin payout per hand
  const inputs = [];   // aligned to base row indices
  base.forEach((r, i) => {
    if(r.name === 'Nothing'){ inputs.push(null); return; }
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;';
    const lbl = document.createElement('div');
    lbl.style.cssText = 'flex:1;font-size:13px;color:#e0e8f8;';
    const jkMult = r.pays[0] > 0 ? r.pays[4] / r.pays[0] : 5;
    lbl.textContent = r.name + (jkMult !== 5 ? '  (×' + jkMult + ' at 5 coins)' : '');
    // Read-only field: tapping opens the number pad instead of the iOS keyboard
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.readOnly = true;
    inp.inputMode = 'none';
    inp.value = cur[i].pays[0];
    inp.style.cssText = [
      'width:84px','padding:6px 8px','font-size:14px','font-weight:bold','text-align:right',
      'background:#0a1a40','border:2px solid #3a5aaa','border-radius:6px','color:#f0c040',
      'cursor:pointer',
    ].join(';');
    inp.addEventListener('click', async () => {
      const n = await showNumPad({ title: r.name, hint: 'Per-coin payout',
                                   initial: inp.value, min: 0, max: 99999 });
      if(n !== null) inp.value = n;
    });
    inputs.push(inp);
    row.appendChild(lbl);
    row.appendChild(inp);
    panel.appendChild(row);
  });

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11px;color:#8899bb;text-align:center;';
  note.textContent = 'Payouts are per coin. Up to 3 custom tables per game; saving with an existing name overwrites it.';
  panel.appendChild(note);

  // Buttons
  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:10px;justify-content:center;flex-wrap:wrap;';
  const mkBtn = (label, bg, border, color) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = [
      'font-family:Arial,Helvetica,sans-serif','font-size:13px','font-weight:bold',
      'letter-spacing:1px','text-transform:uppercase','padding:8px 20px',
      `background:${bg}`,`border:2px solid ${border}`,'border-radius:8px',
      `color:${color}`,'cursor:pointer','touch-action:manipulation',
    ].join(';');
    return b;
  };
  const saveBtn   = mkBtn('Save','linear-gradient(180deg,#2a8a4a,#1a6a34)','#4acc6a','#fff');
  const delBtn    = mkBtn('Delete','linear-gradient(180deg,#8a2020,#601414)','#cc4444','#ffaaaa');
  const cancelBtn = mkBtn('Cancel','linear-gradient(180deg,#3a3a3a,#1a1a1a)','#666','#ccc');

  const close = () => { if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  cancelBtn.addEventListener('click', close);
  overlay.addEventListener('click', e => { if(e.target === overlay) close(); });

  saveBtn.addEventListener('click', () => {
    const label = nameInput.value.trim();
    if(!label){ alert('Please enter a name for the custom pay table.'); return; }
    const vals = inputs.map((inp, i) => {
      if(!inp) return 0;
      const v = parseInt(inp.value, 10);
      return isNaN(v) || v < 0 ? 0 : Math.min(v, 99999);
    });
    gs.customTables = gs.customTables || [];
    const existing = gs.customTables.findIndex(ct => ct.label === label);
    if(existing >= 0){
      gs.customTables[existing] = { label, vals };
    } else if(gs.customTables.length >= 3){
      alert('Limit of 3 custom pay tables per game — delete one first (save with an existing name to overwrite it).');
      return;
    } else {
      gs.customTables.push({ label, vals });
    }
    rebuildPayTables(currentGame);
    // Select the saved table (only between hands; mid-hand keeps the old one)
    if(phase !== 'holding'){
      payTableIdx = GAMES[currentGame]._builtin.length +
                    gs.customTables.findIndex(ct => ct.label === label);
      invalidateAnalysis();
    }
    saveState();
    buildPayTable();
    close();
    if(onSaved) onSaved();
  });

  delBtn.addEventListener('click', () => {
    const label = nameInput.value.trim();
    const idx = (gs.customTables || []).findIndex(ct => ct.label === label);
    if(idx < 0){ alert('No custom table named "' + label + '" to delete.'); return; }
    if(!confirm('Delete custom pay table "' + label + '"?')) return;
    gs.customTables.splice(idx, 1);
    rebuildPayTables(currentGame);
    if(payTableIdx >= curGame().payTables.length){
      payTableIdx = 0;
      invalidateAnalysis();
    }
    saveState();
    buildPayTable();
    close();
    if(onSaved) onSaved();
  });

  btnRow.appendChild(saveBtn);
  btnRow.appendChild(delBtn);
  btnRow.appendChild(cancelBtn);
  panel.appendChild(btnRow);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}

    const wrap = document.createElement('div');

    'color:#aaffbb','cursor:pointer','touch-action:manipulation',
  ].join(';');
  dlBtn.addEventListener('click', () => {
    if (handHistory.length === 0) { alert('No history to download.'); return; }
    const lines = ['entry,credits,delta,type,result,suboptimal,optDelta,optResult,bet'];
    handHistory.forEach((h, i) => {
      const sub = h.sub === true ? 1 : h.sub === false ? 0 : '';
      const opt = typeof h.opt === 'number' ? h.opt : '';
      const bet = typeof h.bet === 'number' ? h.bet : '';
      lines.push(`${i+1},${h.credits},${h.delta},${h.type},${h.res||''},${sub},${opt},${h.optRes||''},${bet}`);
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });

    const reader = new FileReader();
    reader.onload = e => {
      try {
        const rows = e.target.result.split(/\r?\n/).filter(r => r.trim());
        // Expect header: entry,credits,delta,type
        if (rows.length < 2) { alert('CSV appears empty.'); return; }
        const parsed = [];
        for (let i = 1; i < rows.length; i++) {
          const cols = rows[i].split(',');
          if (cols.length < 4) continue;
          const credits = parseFloat(cols[1]);
          const delta   = parseFloat(cols[2]);
          const type    = cols[3].trim();
          if (isNaN(credits) || isNaN(delta)) continue;
          if (!['hand','add','reset'].includes(type)) continue;
          const e = { credits, delta, type };
          // Optional extended columns (result, suboptimal flag, counterfactual)
          if (cols[4] && cols[4].trim())      e.res = cols[4].trim();
          if (cols[5] === '1')                e.sub = true;
          else if (cols[5] === '0')           e.sub = false;

          if (cols[7] && cols[7].trim())      e.optRes = cols[7].trim();
          const bet = parseInt(cols[8], 10);
          if (!isNaN(bet) && bet >= 1 && bet <= 5) e.bet = bet;
          parsed.push(e);
        }

  panel.appendChild(makeSlider('Card Flip Speed', flipDuration, FLIP_MAX, ms => {

  // Highlight Error: red-flash the optimal hold when a non-optimal play is made

    [{ label:'On', value:true }, { label:'Off', value:false }],

  // What the trainer / Highlight Error compare the hold against: the

  // ── Strategy Guide: the full ordered hold list for this pay table ──
  const stratBtn = document.createElement('button');

    'letter-spacing:1px','text-transform:uppercase','padding:9px 12px',
    'background:linear-gradient(180deg,#1a5a7a,#0e3a50)',
    'border:2px solid #4ab0d0','border-radius:8px',
    'color:#bfefff','cursor:pointer','touch-action:manipulation',
  ].join(';');
  cmpBtn.addEventListener('click', () => {
    sfx.button();
    window.open('video-poker-payouts.html', '_blank');

// ════════════════════════════════════════════════════════════
//  STRATEGY SIMULATOR
//  Fast Play: a worker deals random hands and plays every one by the chosen
//  strategy level AND by the full list, on the same cards, so the running
//  returns can be compared to each other and to the exact expected returns
//  in the strategy file.
//  Verify: deals hands one at a time to the analyzer (exact EV of all 32
//  holds) and checks whether the book play is the analyzer's top hold.
//  Both assume max coins (5), like the strategy guide.
// ════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════
//  TRAINING MODE
// ════════════════════════════════════════════════════════════
// No credits and no bet: the only score is whether the hold matched the card.
let trainWorker = null;
function showTraining(){
  sfx.button();
  // Always opens on the game being played; switching here is local to training
  // and never disturbs the hand on the main screen.
  let gKey = currentGame, ptIdx = payTableIdx;
  let cfg = STRAT_CFG[gKey], gameRows = GAMES[gKey].payTables[ptIdx].rows;

  // Kept outside the dialog: Full analysis closes and reopens this screen, and
  // a slider that silently jumped back to the middle each time would quietly
  // undo the setting the player had chosen.
  let mix = trainMixLoad();
  let rec = { per: {}, misses: [] };
  let reviewing = false, reviewQueue = [];
  let qHand = null, qDeck = null, held = 0, answered = false, lastWrong = false;
  let evBusy = 0;                 // pricings still running

  function esc2(t){ return String(t).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c])); }
  function fmtInt(n){ return Math.round(n).toLocaleString(); }
  function cardOf(ci){
    return ci >= 52 ? { rank:'JOKER', suit:'★', joker:true }
                    : { rank: RANKS[ci % 13], suit: SUITS[(ci / 13) | 0] };
  }
  function cardIndex(c){ return c.joker ? 52 : SUITS.indexOf(c.suit) * 13 + RANKS.indexOf(c.rank); }

  const overlay = document.createElement('div');
  overlay.style.cssText = [
    'position:fixed','inset:0','z-index:9999','background:rgba(0,5,25,0.92)',
    'display:flex','align-items:center','justify-content:center','font-family:Arial,Helvetica,sans-serif',

  const panel = document.createElement('div');
