  ctx.font = '11px Arial'; ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
  ctx.fillStyle = '#8899bb';
  ctx.fillText(String(peak), pad.left - 5, Y(peak));
  ctx.fillText('0', pad.left - 5, Y(0));
  for(let i = 0; i < NB; i++){
    if(!bins[i]) continue;
    const a = X(mn + i * bw), b = X(mn + (i + 1) * bw), mid = mn + (i + 0.5) * bw;
    ctx.fillStyle = mid <= lo ? '#d85a30' : mid >= hi ? '#639922' : '#378add';
    ctx.fillRect(a + 0.5, Y(bins[i]), Math.max(1, b - a - 1), pad.top + cH - Y(bins[i]));
  }
  ctx.textAlign = 'center';
  const pooled = (cx, count, color, label) => {
    ctx.fillStyle = color;
    ctx.fillRect(cx - SLOT / 2, Y(count), SLOT, pad.top + cH - Y(count));
    ctx.fillStyle = '#8899bb';
    ctx.fillText(label, cx, H - pad.bottom + 12);
    ctx.fillText(String(count), cx, Y(count) - 8);
  };
  const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v)).toLocaleString();
  if(useOver)  pooled(x1 + 4 + SLOT / 2, over, '#639922', '≥ ' + sgn(hiCut));
  if(useUnder) pooled(pad.left + SLOT / 2, under, '#d85a30', '≤ ' + sgn(loCut));

  const rule = (v, color, txt, dash, top) => {
    if(v < mn || v > mx) return;
    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.setLineDash(dash ? [5, 3] : []);
    ctx.beginPath(); ctx.moveTo(X(v), pad.top); ctx.lineTo(X(v), pad.top + cH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color;
    const x = Math.max(x0 + 20, Math.min(x1 - 20, X(v)));
    ctx.fillText(txt, x, top ? pad.top - 5 : H - pad.bottom + 12);
  };
  rule(0, '#96b4f0', 'break even', false, false);
  rule(lo, '#f09595', sgn(lo), true, false);
  rule(hi, '#7ee08a', sgn(hi), true, false);
  rule(avg, '#f0c040', 'avg ' + sgn(avg), true, true);
}

function drawSimGraph(canvas, samples, r){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = { top: 26, right: 16, bottom: 30, left: 64 };
  const cW = W - pad.left - pad.right, cH = H - pad.top - pad.bottom;
  ctx.fillStyle = '#040d22';
  ctx.fillRect(0, 0, W, H);
  ctx.font = 'bold 12px Arial';
  ctx.textBaseline = 'middle';
  const CRED = r.yMode === 'credits';
  if(samples.length < 2){
    ctx.fillStyle = '#8899bb'; ctx.textAlign = 'center';
    ctx.fillText(samples.length ? 'Running…'
      : CRED ? 'Credits won or lost over hands played will appear here'
             : 'Return % over hands played will appear here', W / 2, H / 2);
    return;
  }
  const SEL = '#ff9f40', FULL = '#5ab0ff', OPT = '#f0c040';
  const BET  = r.bet || 5;
  const nMax = samples[samples.length - 1].n;
  const val  = s => CRED ? s.cs : s.rs;
  const valF = s => CRED ? s.cf : s.rf;
  // Payback is a running average, so its opening points swing wildly and would
  // flatten everything after them — drop the first 10%. Credits start at zero
  // and drift from there, so every point is worth drawing.
  const skip = CRED ? 0 : Math.floor(samples.length * 0.1);
  // Where a reference return sits on this axis. In credits the expectation is
  // not a level: a 99.5% game loses 0.025 coins per hand for as long as you
  // play, so the reference becomes a SLOPE from the origin and the run is read
  // against that drift rather than against a flat line.
  const expAt = v => CRED ? (v - 1) * BET * nMax : v;

  const ys = [r.expSel, r.optimal].concat(r.showFull ? [r.expFull] : [])
    .filter(v => typeof v === 'number').map(expAt);
  if(CRED) ys.push(0);
  if(CRED && typeof r.bustAt === 'number') ys.push(r.bustAt);
  if(CRED && typeof r.winAt === 'number') ys.push(r.winAt);
  for(let i = skip; i < samples.length; i++){ ys.push(val(samples[i])); if(r.showFull) ys.push(valF(samples[i])); }
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const mid = (lo + hi) / 2, half = Math.max((hi - lo) / 2 * 1.3, CRED ? 5 : 0.003);
  lo = mid - half; hi = mid + half;
  const X = n => pad.left + n / nMax * cW;
  const Y = v => pad.top + (hi - v) / (hi - lo) * cH;
  const nice = (raw, cands) => cands.find(c => c >= raw) || cands[cands.length - 1];
  // credits are whole coins, so their step walks 1/2/5 times a decade
  const niceStep = raw => {
    const m = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9))));
    return nice(raw / m, [1, 2, 5, 10]) * m;
  };

  // gridlines
  ctx.strokeStyle = 'rgba(80,110,180,0.35)'; ctx.lineWidth = 1;
  ctx.fillStyle = '#8899bb'; ctx.font = '11px Arial'; ctx.textAlign = 'right';
  const yStep = CRED ? niceStep((hi - lo) / 5)
                     : nice((hi - lo) / 5, [0.0005,0.001,0.002,0.005,0.01,0.02,0.05,0.1,0.2,0.5,1]);
  const yTxt = v => CRED
    ? (v > 0.5 ? '+' : v < -0.5 ? '−' : '') + Math.abs(Math.round(v)).toLocaleString()
    : (v * 100).toFixed(yStep < 0.001 ? 3 : 2) + '%';
  for(let v = Math.ceil(lo / yStep) * yStep; v <= hi + 1e-12; v += yStep){
    ctx.beginPath(); ctx.moveTo(pad.left, Y(v)); ctx.lineTo(W - pad.right, Y(v)); ctx.stroke();
    ctx.fillText(yTxt(v), pad.left - 6, Y(v));
  }
  // break-even carries the weight in credits that 100% does in payback, so it
  // gets a brighter rule instead of blending into the grid
  if(CRED && lo < 0 && hi > 0){
    ctx.strokeStyle = 'rgba(150,180,240,0.8)';
    ctx.beginPath(); ctx.moveTo(pad.left, Y(0)); ctx.lineTo(W - pad.right, Y(0)); ctx.stroke();
    ctx.strokeStyle = 'rgba(80,110,180,0.35)';
  }
  // the walk-away figure — the line a run cashes out on
  if(CRED && typeof r.winAt === 'number' && r.winAt >= lo && r.winAt <= hi){
    ctx.strokeStyle = '#7ee08a'; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(pad.left, Y(r.winAt)); ctx.lineTo(W - pad.right, Y(r.winAt)); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1;
    ctx.fillStyle = '#7ee08a'; ctx.textAlign = 'left'; ctx.font = 'bold 10px Arial';
    ctx.fillText('WALK AWAY', pad.left + 4, Y(r.winAt) + 11);
    ctx.font = '11px Arial'; ctx.textAlign = 'right';
    ctx.strokeStyle = 'rgba(80,110,180,0.35)';
  }
  // the bankroll floor — the line a run dies on
  if(CRED && typeof r.bustAt === 'number' && r.bustAt >= lo && r.bustAt <= hi){
    ctx.strokeStyle = '#f09595'; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(pad.left, Y(r.bustAt)); ctx.lineTo(W - pad.right, Y(r.bustAt)); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1;
    ctx.fillStyle = '#f09595'; ctx.textAlign = 'left'; ctx.font = 'bold 10px Arial';
    ctx.fillText('BANKROLL', pad.left + 4, Y(r.bustAt) - 7);
    ctx.font = '11px Arial'; ctx.textAlign = 'right';
    ctx.strokeStyle = 'rgba(80,110,180,0.35)';
  }
  ctx.textAlign = 'center';
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(1, nMax / 6))));
  const xStep = nice(nMax / 6 / mag, [1, 2, 5, 10]) * mag;
  for(let n = xStep; n <= nMax; n += xStep){
    ctx.beginPath(); ctx.moveTo(X(n), pad.top); ctx.lineTo(X(n), H - pad.bottom); ctx.stroke();
    ctx.fillText(n >= 1000 ? (n / 1000) + 'k' : String(n), X(n), H - pad.bottom + 12);
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(pad.left, pad.top, cW, cH); ctx.clip();
  // expected / optimal reference lines
  const ref = (v, color) => {
    if(typeof v !== 'number') return;
    ctx.setLineDash([6, 4]); ctx.strokeStyle = color; ctx.lineWidth = 1.2;
    ctx.beginPath();
    if(CRED){ ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(nMax), Y(expAt(v))); }
    else    { ctx.moveTo(pad.left, Y(v)); ctx.lineTo(W - pad.right, Y(v)); }
    ctx.stroke(); ctx.setLineDash([]);
  };
  ref(r.optimal, OPT);
  if(r.showFull) ref(r.expFull, FULL);
  ref(r.expSel, SEL);
  // running returns
  const series = (getter, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    samples.forEach((s, i) => { const x = X(s.n), y = Y(getter(s)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  };
  if(r.showFull) series(valF, FULL);
  series(val, SEL);
  ctx.restore();

  // legend
  ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left';
  let lx = pad.left;
  const leg = (color, text, dashed) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash(dashed ? [5, 3] : []);
    ctx.beginPath(); ctx.moveTo(lx, 12); ctx.lineTo(lx + 18, 12); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.fillText(text, lx + 22, 12);
    lx += 22 + ctx.measureText(text).width + 16;
  };
  leg(SEL, (r.selName || '').toUpperCase());
  if(r.showFull) leg(FULL, 'FULL');
  leg(OPT, 'OPTIMAL', true);
}

// ════════════════════════════════════════════════════════════
//  GRAPH MODAL
// ════════════════════════════════════════════════════════════
function showGraph(){
  const history = handHistory.slice();   // full copy, up to 1000

  // ── Overlay ──────────────────────────────────────────────
  const overlay = document.createElement('div');
  overlay.style.cssText = [
    'position:fixed','inset:0','z-index:9999',
    'background:rgba(0,5,25,0.88)',
    'display:flex','align-items:center','justify-content:center',
    'font-family:Arial,Helvetica,sans-serif',
  ].join(';');

  // ── Panel ────────────────────────────────────────────────
  const panel = document.createElement('div');
  panel.style.cssText = [
    'background:linear-gradient(180deg,#0d2255 0%,#091840 100%)',
    'border:2px solid #2a4a9a',
    'border-radius:14px',
    'box-shadow:0 0 30px rgba(20,60,180,0.6)',
    'padding:16px',
    'width:min(1040px,96vw)',
    'display:flex','flex-direction:column','gap:10px',
  ].join(';');

  // ── Range state (1-based, inclusive) ─────────────────────
  // Start defaults to last saved position; End always defaults to most recent entry
  let rangeStart = Math.min(graphRangeStart, history.length || 1);
  let rangeEnd   = history.length;

  // ── Title ─────────────────────────────────────────────────
  const title = document.createElement('div');
  title.style.cssText = [
    'text-align:center','font-size:16px','font-weight:bold',
    'color:#f0c040','letter-spacing:3px','text-transform:uppercase',
    'text-shadow:0 0 8px rgba(240,192,64,0.5)',
  ].join(';');

  function updateTitle(){
    const total = history.length;
    const shown = rangeEnd - rangeStart + 1;
    const gname = curGame().name;
    title.textContent = total === 0
      ? `${gname} History — No Entries`
      : rangeStart === 1 && rangeEnd === total
        ? `${gname} History — ${total} Entr${total!==1?'ies':'y'}`
        : `${gname} History — Entries ${rangeStart}–${rangeEnd} of ${total}`;
  }
  updateTitle();

  // ── Canvas ────────────────────────────────────────────────
  const canvas = document.createElement('canvas');
  const cw = Math.min(1000, Math.round(window.innerWidth * 0.92));
  canvas.width  = cw;
  canvas.height = Math.round(Math.min(cw * 0.48, window.innerHeight * 0.58));
  canvas.style.cssText = 'width:100%;height:auto;display:block;border-radius:6px;touch-action:none;';

  let hoverIdx = null;   // slice index under the finger/cursor
  let altSel   = [];     // pay-table indices selected for comparison lines

  function redraw(){
    updateTitle();
    const slice = history.slice(rangeStart-1, rangeEnd);
    drawGraph(canvas, slice, rangeStart - 1, hoverIdx, altSel);
  }

  // ── Pointer → canvas coordinate helpers ───────────────────
  const PAD = { top:28, right:20, bottom:38, left:68 };   // must match drawGraph
  function canvasX(clientX){
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left) * (canvas.width / r.width);
  }
  function chartW(){ return canvas.width - PAD.left - PAD.right; }
  // Entry index (in the current slice) nearest to canvas x
  function sliceIdxAt(cx){
    const n = rangeEnd - rangeStart + 1;
    if(n <= 0) return null;
    if(n === 1) return 0;
    const f = (cx - PAD.left) / chartW() * (n - 1);
    return Math.max(0, Math.min(n - 1, Math.round(f)));
  }

  // ── Two-finger pinch-zoom / pan  +  one-finger result readout ──
  let pinch = null;
  canvas.addEventListener('touchstart', e => {
    if(e.touches.length === 2){
      e.preventDefault();
      hoverIdx = null;
      const x1 = canvasX(e.touches[0].clientX), x2 = canvasX(e.touches[1].clientX);
      const span = rangeEnd - rangeStart;      // entries spanned (0-based)
      const cx = (x1 + x2) / 2;
      pinch = {
        dist: Math.max(20, Math.abs(x2 - x1)),
        // data-space anchor: the entry index under the initial midpoint
        anchor: rangeStart + (cx - PAD.left) / chartW() * span,
        span,
      };
    } else if(e.touches.length === 1 && history.length){
      hoverIdx = sliceIdxAt(canvasX(e.touches[0].clientX));
      redraw();
    }
  }, { passive:false });

  canvas.addEventListener('touchmove', e => {
    if(e.touches.length === 2 && pinch){
      e.preventDefault();
      const total = history.length;
      const x1 = canvasX(e.touches[0].clientX), x2 = canvasX(e.touches[1].clientX);
      const dist = Math.max(20, Math.abs(x2 - x1));
      const cx   = (x1 + x2) / 2;
      // New span: pinch out → zoom in (span shrinks); pinch in → zoom out
      let span = Math.round(pinch.span * pinch.dist / dist);
      span = Math.max(1, Math.min(total - 1, span));
      // Keep the anchored entry under the fingers' current midpoint (pans too)
      const frac = (cx - PAD.left) / chartW();
      let s = Math.round(pinch.anchor - frac * span);
      s = Math.max(1, Math.min(total - span, s));
      rangeStart = s;
      rangeEnd   = Math.min(total, s + span);
      redraw();
    } else if(e.touches.length === 1 && history.length){
      e.preventDefault();
      hoverIdx = sliceIdxAt(canvasX(e.touches[0].clientX));
      redraw();
    }
  }, { passive:false });

  canvas.addEventListener('touchend', e => {
    if(e.touches.length < 2 && pinch){
      pinch = null;
      graphRangeStart = rangeStart;   // persist the zoomed position
      saveState();
    }
    if(e.touches.length === 0 && hoverIdx !== null){
      hoverIdx = null;
      redraw();
    }
  });

  // Desktop: mouse hover shows the same readout
  canvas.addEventListener('mousemove', e => {
    if(!history.length) return;
    hoverIdx = sliceIdxAt(canvasX(e.clientX));
    redraw();
  });
  canvas.addEventListener('mouseleave', () => { hoverIdx = null; redraw(); });

  // ── Button row ────────────────────────────────────────────
  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;justify-content:center;flex-wrap:wrap;';

  function makeModalBtn(label, bg, border, color){
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = [
      `font-family:Arial,Helvetica,sans-serif`,
      `font-size:12px`,`font-weight:bold`,`letter-spacing:1px`,
      `text-transform:uppercase`,`padding:7px 18px`,
      `background:${bg}`,`border:2px solid ${border}`,
      `border-radius:7px`,`color:${color}`,
      `cursor:pointer`,`touch-action:manipulation`,
    ].join(';');
    return b;
  }

  // Range button
  const rangeBtn = makeModalBtn('Range','linear-gradient(180deg,#1a6a6a,#0e4444)','#3acccc','#aaffff');
  rangeBtn.addEventListener('click', async () => {
    const total = history.length;
    if(total === 0){ alert('No entries to filter.'); return; }
    const s = await showNumPad({ title: 'Start Entry', hint: `1 – ${total}`,
                                 initial: rangeStart, min: 1, max: total });
    if(s === null) return;
    const e = await showNumPad({ title: 'End Entry', hint: `${s} – ${total}`,
                                 initial: Math.min(rangeEnd, total), min: s, max: total });
    if(e === null) return;
    rangeStart = s;
    rangeEnd   = e;
    graphRangeStart = s;
    saveState();
    redraw();
  });

  // Reset range button (show all)
  const allBtn = makeModalBtn('Show All','linear-gradient(180deg,#2a4aaa,#1a2a7a)','#5a7acc','#fff');
  allBtn.addEventListener('click', () => {
    rangeStart = 1;
    rangeEnd   = history.length || 1;
    graphRangeStart = 1;
    saveState();
    redraw();
  });

  // Pay-table comparison button — pick alternate tables to overlay
  const cmpBtn = makeModalBtn('Pay Tables','linear-gradient(180deg,#5a2a8a,#3a1a6a)','#aa66dd','#ddb8ff');
  cmpBtn.addEventListener('click', () => {
    const tables = curGame().payTables;
    const ov2 = document.createElement('div');
    ov2.style.cssText = [
      'position:fixed','inset:0','z-index:10000',
      'background:rgba(0,5,25,0.7)',
      'display:flex','align-items:center','justify-content:center',
      'font-family:Arial,Helvetica,sans-serif',
    ].join(';');
    const p2 = document.createElement('div');
    p2.style.cssText = [
      'background:linear-gradient(180deg,#0d2255 0%,#091840 100%)',
      'border:2px solid #2a4a9a','border-radius:12px',
      'box-shadow:0 0 24px rgba(20,60,180,0.6)',
      'padding:18px 22px','width:min(360px,90vw)',
      'display:flex','flex-direction:column','gap:12px',
    ].join(';');
    const t2 = document.createElement('div');
    t2.style.cssText = 'text-align:center;font-size:14px;font-weight:bold;color:#f0c040;letter-spacing:2px;text-transform:uppercase;';
    t2.textContent = 'Compare Pay Tables';
    const note = document.createElement('div');
    note.style.cssText = 'font-size:11px;color:#8899bb;text-align:center;';
    note.textContent = 'Overlay what your credits would be under other ' +
                       curGame().name + ' pay tables casinos offer, from the first visible point.';
    p2.appendChild(t2);
    p2.appendChild(note);

    const ALT_COLORS = ['#ff4fd8','#ffa040','#8dff5a','#c084fc'];
    tables.forEach((t, i) => {
      const row = document.createElement('label');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;color:#e0e8f8;font-size:14px;cursor:pointer;';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = altSel.includes(i);
      cb.style.cssText = 'width:17px;height:17px;accent-color:#aa66dd;';
      cb.addEventListener('change', () => {
        altSel = cb.checked ? [...altSel, i] : altSel.filter(x => x !== i);
        redraw();
      });
      const sw = document.createElement('span');
      sw.style.cssText = `display:inline-block;width:18px;height:4px;border-radius:2px;background:${ALT_COLORS[i % ALT_COLORS.length]};`;
      const txt = document.createElement('span');
      txt.textContent = t.label + (i === payTableIdx ? '  (current)' : '');
      row.appendChild(cb);
      row.appendChild(sw);
      row.appendChild(txt);
      p2.appendChild(row);
    });

    const done2 = makeModalBtn('Done','linear-gradient(180deg,#2a4aaa,#1a2a7a)','#5a7acc','#fff');
    done2.style.alignSelf = 'center';
    const close2 = () => { if(ov2.parentNode) ov2.parentNode.removeChild(ov2); };
    done2.addEventListener('click', close2);
    ov2.addEventListener('click', e => { if(e.target === ov2) close2(); });
    p2.appendChild(done2);
    ov2.appendChild(p2);
    document.body.appendChild(ov2);
  });

  // Non-Optimal Plays replay viewer (opens above this window)
  const subBtn = makeModalBtn('Sub-Opt Plays','linear-gradient(180deg,#8a4a10,#5a2e08)','#ff8c30','#ffc890');
  subBtn.addEventListener('click', showSubPlays);

  // Optimal-line toggle
  const optBtn = makeModalBtn('', 'linear-gradient(180deg,#155a8a,#0c3a5c)', '#38b6ff', '#a8dcff');
  const optLabel = () => { optBtn.textContent = graphShowOpt ? 'Optimal: On' : 'Optimal: Off'; };
  optLabel();
  optBtn.addEventListener('click', () => {
    graphShowOpt = !graphShowOpt;
    optLabel();
    saveState();
    redraw();
  });

  // Clear history button
  const clearBtn = makeModalBtn('Reset Log','linear-gradient(180deg,#8a2020,#601414)','#cc4444','#ffaaaa');
  clearBtn.addEventListener('click', () => {
    if(!confirm('Clear all session history? This cannot be undone.')) return;
    handHistory = [];
    subPlays = [];       // their hand numbers reference the cleared log
    graphRangeStart = 1;
    saveState();
    history.splice(0);     // clear the local copy too
    rangeStart = 1;
    rangeEnd   = 0;
    redraw();
  });

  // Close button
  const closeBtn = makeModalBtn('Close','linear-gradient(180deg,#3a3a3a,#1a1a1a)','#666','#ccc');
  const close = () => { if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', e => { if(e.target===overlay) close(); });

  btnRow.appendChild(rangeBtn);
  btnRow.appendChild(allBtn);
  btnRow.appendChild(optBtn);
  btnRow.appendChild(cmpBtn);
  btnRow.appendChild(subBtn);
  btnRow.appendChild(clearBtn);
  btnRow.appendChild(closeBtn);

  panel.appendChild(title);
  panel.appendChild(canvas);
  panel.appendChild(btnRow);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  redraw();
}

// ── Canvas chart ─────────────────────────────────────────────
// offset   = index of history[0] in the full handHistory array
// hoverIdx = slice index to highlight with a crosshair + readout (or null)
// altIdxs  = pay-table indices of the current game to overlay as
//            what-if lines (each hand re-priced under that table)
function drawGraph(canvas, history, offset=0, hoverIdx=null, altIdxs=[]){
  const ctx  = canvas.getContext('2d');
  const W    = canvas.width;
  const H    = canvas.height;
  const pad  = { top:28, right:20, bottom:38, left:68 };
  const cW   = W - pad.left - pad.right;
  const cH   = H - pad.top  - pad.bottom;
  const denom = DENOMINATIONS[denomIdx].value;

  // Background
  ctx.fillStyle = '#040d22';
  ctx.fillRect(0, 0, W, H);

  if(history.length === 0){
    ctx.fillStyle    = '#f0c040';
    ctx.font         = 'bold 15px Arial';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('No hands played yet — deal a few hands first!', W/2, H/2);
    return;
  }

  const rawValues = history.map(h => h.credits);

  // "Combine Added Cash at Beginning" — DISPLAY ONLY, stored history is
  // untouched. Every credit add inside the visible range is shown as if it
  // had happened at the first point: the line starts higher by the total
  // added, and each add's jump is removed, so what remains is the pure
  // win/loss pattern of play.
  let values = rawValues;
  if(graphCombineAdds && history.length > 1){
    let addTotal = 0;
    for(let i=1; i<history.length; i++) if(history[i].type === 'add') addTotal += (history[i].delta || 0);
    values = [rawValues[0] + addTotal];
    for(let i=1; i<history.length; i++){
      let step = rawValues[i] - rawValues[i-1];
      if(history[i].type === 'add') step -= (history[i].delta || 0);
      values.push(values[i-1] + step);
    }
  }

  // ── Optimal-play line ───────────────────────────────────
  // Anchored to the leftmost VISIBLE point, then accumulates each hand's
  // optimal-hold counterfactual result instead of the actual result.
  // Hands without recorded counterfactuals fall back to the actual delta;
  // credit adds apply equally; resets re-sync to the actual value.
  // Unrecorded credit changes (e.g. a bet deducted for a hand that was
  // never completed before an app reload) appear as a mismatch between the
  // credits step and the recorded delta. Fold that gap into every
  // comparison line so they stay honest against the actual line.
  const stepGap = i => {
    const h = history[i];
    return h.type === 'hand' ? (rawValues[i] - rawValues[i-1]) - h.delta : 0;
  };

  const optValues = [values[0]];
  for(let i=1; i<history.length; i++){
    const h = history[i];
    if(h.type === 'hand')     optValues.push(optValues[i-1] + (typeof h.opt === 'number' ? h.opt : h.delta) + stepGap(i));
    else if(h.type === 'add') optValues.push(optValues[i-1] + (graphCombineAdds ? 0 : (h.delta || 0)));
    else                      optValues.push(values[i]);
  }
  const optDiffers = optValues.some((v,i) => v !== values[i]);
  const showOpt    = graphShowOpt && optDiffers;   // line can be toggled off
  const hasSub     = history.some(h => h.type === 'hand' && h.sub === true);

  // ── Alternate pay-table lines ──────────────────────────
  // Each selected table re-prices every visible hand (result name + bet →
  // that table's payout), anchored to the leftmost visible point. Hands
  // without recorded result/bet fall back to the actual delta.
  const ALT_COLORS = ['#ff4fd8','#ffa040','#8dff5a','#c084fc'];
  const tables = curGame().payTables;
  const altLines = (altIdxs || []).filter(ti => tables[ti]).map(ti => {
    const rows = tables[ti].rows;
    const vals = [values[0]];
    for(let i=1; i<history.length; i++){
      const h = history[i];
      if(h.type === 'hand'){
        let d = h.delta;
        if(h.res && typeof h.bet === 'number'){
          const cat = rows.findIndex(r => r.name === h.res);
          if(cat >= 0) d = rows[cat].pays[h.bet-1] - h.bet;
        }
        vals.push(vals[i-1] + d + stepGap(i));
      }
      else if(h.type === 'add') vals.push(vals[i-1] + (graphCombineAdds ? 0 : (h.delta || 0)));
      else                      vals.push(values[i]);
    }
    return { vals, color: ALT_COLORS[ti % ALT_COLORS.length], label: tables[ti].label };
  });

  // Scale the chart to every visible line
  let minV = Math.min(...values), maxV = Math.max(...values);
  if(showOpt){
    minV = Math.min(minV, Math.min(...optValues));
    maxV = Math.max(maxV, Math.max(...optValues));
  }
  altLines.forEach(a => {
    minV = Math.min(minV, Math.min(...a.vals));
    maxV = Math.max(maxV, Math.max(...a.vals));
  });
  const range  = maxV - minV || 10;
  const yMin   = minV - range * 0.12;
  const yMax   = maxV + range * 0.12;

  const toX = i  => pad.left + (history.length > 1 ? (i/(history.length-1))*cW : cW/2);
  const toY = v  => pad.top  + cH - ((v - yMin)/(yMax - yMin))*cH;

  // ── Gridlines on clean multiples of 5/10/25/50/… ────────
  const NICE = [5,10,25,50,100,250,500,1000,2500,5000,10000,25000,50000,100000];
  const step = NICE.find(s => (yMax - yMin)/s <= 6) || 250000;
  for(let v = Math.ceil(yMin/step)*step; v <= yMax; v += step){
    const y = toY(v);
    ctx.strokeStyle = v === 0 ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.08)';
    ctx.lineWidth   = 1;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left+cW, y); ctx.stroke();

    ctx.fillStyle    = '#8899bb';
    ctx.font         = '11px Arial';
    ctx.textAlign    = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(formatMoney(v*denom), pad.left-6, y);
  }

  // ── X-axis labels (1-based, adjusted for range offset) ─
  const lblCount = Math.min(history.length, 10);
  ctx.fillStyle    = '#8899bb';
  ctx.font         = '11px Arial';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'top';
  for(let k=0; k<lblCount; k++){
    const idx = lblCount===1 ? 0 : Math.round(k*(history.length-1)/(lblCount-1));
    ctx.fillText(offset + idx + 1, toX(idx), pad.top+cH+6);
  }

  // ── Axis label ─────────────────────────────────────────
  ctx.fillStyle    = '#c0c8d8';
  ctx.font         = 'bold 10px Arial';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('HAND  NUMBER', pad.left+cW/2, H-1);

  // ── Filled area under the actual line ──────────────────
  if(history.length > 1){
    ctx.beginPath();
    ctx.moveTo(toX(0), toY(values[0]));
    for(let i=1; i<values.length; i++) ctx.lineTo(toX(i), toY(values[i]));
    ctx.lineTo(toX(values.length-1), pad.top+cH);
    ctx.lineTo(toX(0),               pad.top+cH);
    ctx.closePath();
    ctx.fillStyle = 'rgba(240,192,64,0.13)';
    ctx.fill();
  }

  // ── Alternate pay-table lines ──────────────────────────
  if(history.length > 1){
    altLines.forEach(a => {
      ctx.beginPath();
      ctx.moveTo(toX(0), toY(a.vals[0]));
      for(let i=1; i<a.vals.length; i++) ctx.lineTo(toX(i), toY(a.vals[i]));
      ctx.strokeStyle = a.color;
      ctx.lineWidth   = 2;
      ctx.stroke();
    });
  }

  // ── Optimal-play line (cyan) ───────────────────────────
  if(history.length > 1 && showOpt){
    ctx.beginPath();
    ctx.moveTo(toX(0), toY(optValues[0]));
    for(let i=1; i<optValues.length; i++) ctx.lineTo(toX(i), toY(optValues[i]));
    ctx.strokeStyle = '#38b6ff';
    ctx.lineWidth   = 2;
    ctx.stroke();
  }

  // ── Actual line — segment by segment so runs into a green event are green ──
  const isEvent = i => history[i] && (history[i].type==='add' || history[i].type==='reset');
  ctx.lineWidth = 2;
  ctx.lineJoin  = 'round';
  let currentColor = isEvent(0) ? '#3cdc64' : '#f0c040';
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(values[0]));
  for(let i=1; i<values.length; i++){
    const segColor = isEvent(i) ? '#3cdc64' : '#f0c040';
    if(segColor !== currentColor){
      ctx.strokeStyle = currentColor;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(toX(i-1), toY(values[i-1]));
      currentColor = segColor;
    }
    ctx.lineTo(toX(i), toY(values[i]));
  }
  ctx.strokeStyle = currentColor;
  ctx.stroke();

  // ── Dots: gold = hand, green = add/reset, red = suboptimal hold ─
  const dotR = values.length > 30 ? 2 : 3;
  for(let i=0; i<values.length; i++){
    const h = history[i];
    const ev  = h.type === 'add' || h.type === 'reset';
    const sub = h.type === 'hand' && h.sub === true;
    // Skip plain dots when crowded; always mark events and suboptimal plays
    if(!ev && !sub && values.length > 50) continue;
    if(ev){
      ctx.strokeStyle = 'rgba(60,220,100,0.55)';
      ctx.lineWidth   = 1;
      ctx.setLineDash([3,3]);
      ctx.beginPath();
      ctx.moveTo(toX(i), pad.top);
      ctx.lineTo(toX(i), pad.top+cH);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.beginPath();
    ctx.arc(toX(i), toY(values[i]), (ev || sub) ? dotR+1 : dotR, 0, Math.PI*2);
    ctx.fillStyle = ev ? '#3cdc64' : sub ? '#ff5050' : '#f0c040';
    ctx.fill();
  }

  // ── Legend (top-right) ─────────────────────────────────
  ctx.font = 'bold 10px Arial';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const ly = pad.top - 12;
  // Items are measured and laid out sequentially, so any combination of
  // labels (including the long "ADDS AT START" variant) fits without overlap
  const legend = [{ kind:'line', color:'#f0c040',
                    text: graphCombineAdds ? 'ACTUAL · ADDS AT START' : 'ACTUAL' }];
  if(showOpt) legend.push({ kind:'line', color:'#38b6ff', text:'OPTIMAL' });
  if(hasSub)  legend.push({ kind:'dot',  color:'#ff5050', text:'SUBOPT.' });
  const LGAP = 14;
  legend.forEach(it => {
    it.mark = it.kind === 'line' ? 16 : 8;             // swatch width
    it.w    = it.mark + 4 + Math.ceil(ctx.measureText(it.text).width);
  });
  const legendW = legend.reduce((s, it) => s + it.w, 0) + LGAP * (legend.length - 1);
  let lx = W - pad.right - legendW;
  const legendLeft = lx;                               // alt labels must stop before this
  legend.forEach(it => {
    if(it.kind === 'line'){
      ctx.strokeStyle = it.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + it.mark, ly); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(lx + 4, ly, 3, 0, Math.PI*2);
      ctx.fillStyle = it.color; ctx.fill();
    }
    ctx.fillStyle = '#c0c8d8';
    ctx.fillText(it.text, lx + it.mark + 4, ly);
    lx += it.w + LGAP;
  });

  // Alternate pay-table legend, left-aligned on the same line —
  // stops if it would run into the right-hand legend
  let ax = pad.left + 4;
  altLines.forEach(a => {
    const w = 28 + Math.ceil(ctx.measureText(a.label).width);
    if(ax + w > legendLeft - 10) return;
    ctx.strokeStyle = a.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ly); ctx.lineTo(ax+16, ly); ctx.stroke();
    ctx.fillStyle = '#c0c8d8';
    ctx.fillText(a.label, ax+20, ly);
    ax += w;
  });

  // ── Hover crosshair + readout ──────────────────────────
  if(hoverIdx !== null && history[hoverIdx]){
    const h = history[hoverIdx];
    const x = toX(hoverIdx);

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth   = 1;
    ctx.setLineDash([4,3]);
    ctx.beginPath();
    ctx.moveTo(x, pad.top);
    ctx.lineTo(x, pad.top+cH);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(x, toY(values[hoverIdx]), 5, 0, Math.PI*2);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Readout lines
    const num = offset + hoverIdx + 1;
    const fmtD = d => (d >= 0 ? '+' : '') + d;
    const lines = [];
    if(h.type === 'hand'){
      lines.push(`#${num}   ${h.res || 'Hand'}   ${fmtD(h.delta)}`);
      lines.push(`Credits: ${formatMoney(values[hoverIdx]*denom)}` +
        (values[hoverIdx] !== h.credits ? `  (recorded ${formatMoney(h.credits*denom)})` : ''));
      if(h.sub === true && typeof h.opt === 'number')
        lines.push(`Optimal: ${h.optRes || '?'}   ${fmtD(h.opt)}`);
      else if(h.sub === false)
        lines.push('Optimal hold ✓');
    } else {
      lines.push(`#${num}   ${h.type === 'add' ? 'Added credits' : 'Credits reset'}`);
      lines.push(`Credits: ${formatMoney(values[hoverIdx]*denom)}` +
        (values[hoverIdx] !== h.credits ? `  (recorded ${formatMoney(h.credits*denom)})` : ''));
    }

    // Colored readout lines; append the alternate-table values at this point
    const tipLines = lines.map((t, i) => ({
      t, c: i === 0 ? '#f0c040' : (t.startsWith('Optimal:') ? '#38b6ff' : '#e0e8f8'),
    }));
    altLines.forEach(a => tipLines.push({
      t: `${a.label}: ${formatMoney(a.vals[hoverIdx]*denom)}`, c: a.color,
    }));

    ctx.font = 'bold 12px Arial';
    const bw = Math.max(...tipLines.map(l => ctx.measureText(l.t).width)) + 20;
    const bh = tipLines.length * 17 + 12;
    let bx = x + 12;
    if(bx + bw > W - pad.right) bx = x - 12 - bw;
    const by = pad.top + 4;

    ctx.fillStyle = 'rgba(4,13,34,0.92)';
    ctx.strokeStyle = '#38609a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 6) : ctx.rect(bx, by, bw, bh);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    tipLines.forEach((l, i) => {
      ctx.fillStyle = l.c;
      ctx.fillText(l.t, bx+10, by+8 + i*17);
    });
  }

  // ── Axes ───────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left,       pad.top+cH);
  ctx.lineTo(pad.left+cW,    pad.top+cH);
  ctx.stroke();
}

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
function init(){
  loadState();           // restore per-game state + shared settings
  applyAnimSettings();   // push loaded values into the CSS custom property
  applyTheme();
  updateTitleBar();
  buildPayTable();
  buildDenomButtons();
  updateInfoRow();
  setButtons(true);      // idle state: Analyze button reads "Sub-Opt Play"

  // Render empty card backs as placeholders
  renderCardsBack();

  document.getElementById('btn-game').addEventListener('click',        showGameSelect);
  document.getElementById('btn-deal').addEventListener('click',        deal);
  document.getElementById('btn-bet-one').addEventListener('click',     betOne);
  document.getElementById('btn-bet-max').addEventListener('click',     betMax);
  document.getElementById('btn-add-credits').addEventListener('click', addCredits);
  document.getElementById('btn-reset').addEventListener('click',       resetCredits);
  document.getElementById('btn-settings').addEventListener('click',    showSettings);
  document.getElementById('btn-graph').addEventListener('click',       showGraph);
  // Dispatcher: live-hand analysis while holding, sub-opt viewer otherwise.
  // (Wrapped: the click event must not reach showAnalysis's customHand param.)
  document.getElementById('btn-analyze').addEventListener('click', () => {
    if(phase === 'holding') showAnalysis();
    else showSubPlays();
  });
  document.getElementById('cs-coin').addEventListener('click',         showDenomPopup);

  // Delegated card tap on pointerdown — registers the instant the finger
  // touches, so rapid multi-card taps all land (click waits for finger-up
  // and iOS can swallow quick successive ones)
  document.getElementById('cards-row').addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;   // primary button/touch only
    const cardEl = e.target.closest('.card');
    if (!cardEl) return;
    e.preventDefault();   // suppress the follow-up synthetic mouse events
    const i = parseInt(cardEl.dataset.index);
    if (!isNaN(i)) toggleHold(i);
  });

  // Restore an in-flight hand from a mid-hand reload — the bet was
  // already deducted at Deal time, so the player picks up where they left off
  if (pendingLive) {
    hand  = pendingLive.hand;
    held  = Array.isArray(pendingLive.held) && pendingLive.held.length === 5
            ? pendingLive.held : [false,false,false,false,false];
    deck  = Array.isArray(pendingLive.deck) ? pendingLive.deck : [];
    phase = 'holding';
    pendingLive = null;
    renderCards(true, false);
    document.querySelectorAll('.card').forEach((c,i) => c.classList.toggle('held', held[i]));
    document.querySelectorAll('.hold-badge').forEach((b,i) => b.classList.toggle('visible', held[i]));
    setButtons(false);
    startAnalysisAsync();
    setMessage('Hand restored — select cards to hold, then Draw', false);
  }

  rescale();

  // Keyboard shortcuts
  document.addEventListener('keydown', e=>{
    if(e.code==='Space' || e.code==='Enter') { e.preventDefault(); deal(); }
    if(e.code==='KeyB') betOne();
    if(e.code==='KeyM') betMax();
    if(phase==='holding'){
      const keys={'Digit1':0,'Digit2':1,'Digit3':2,'Digit4':3,'Digit5':4};
      if(keys[e.code]!==undefined) toggleHold(keys[e.code]);
    }
  });
}

init();

// ════════════════════════════════════════════════════════════
//  RESPONSIVE SCALING
//  Scales the fixed-width terminal to fill any screen size,
//  from iPhone SE landscape up to iPad Pro.
// ════════════════════════════════════════════════════════════
function rescale() {
  const t = document.getElementById('terminal');

  // Reset to natural layout so offsetWidth/Height are unscaled
  t.style.transform = 'none';
  t.style.left      = '0';
  t.style.top       = '0';

  // Safe-area insets via CSS custom properties (env() values resolve correctly here)
  const cs    = getComputedStyle(document.documentElement);
  const safeW = parseFloat(cs.getPropertyValue('--sal')) + parseFloat(cs.getPropertyValue('--sar')) || 0;
  const safeH = parseFloat(cs.getPropertyValue('--sat')) + parseFloat(cs.getPropertyValue('--sab')) || 0;

  const vp = window.visualViewport || { width: window.innerWidth, height: window.innerHeight };

  const scale = Math.min(
    (vp.width  - safeW - 8) / t.offsetWidth,
    (vp.height - safeH - 8) / t.offsetHeight,
    1.4          // max upscale for iPad
  );

  // Centre the terminal precisely using fixed positioning + manual offsets.
  // transform:scale() scales the terminal as a single bitmap — fonts, card
  // symbols, borders and layout all scale together by exactly the same factor,
  // unlike CSS zoom which can diverge from font rendering in Safari/iOS.
  const scaledW = t.offsetWidth  * scale;
  const scaledH = t.offsetHeight * scale;
  t.style.position        = 'fixed';
  t.style.left            = Math.round((vp.width  - scaledW) / 2) + 'px';
  t.style.top             = Math.round((vp.height - scaledH) / 2) + 'px';
  t.style.transformOrigin = 'top left';
  t.style.transform       = `scale(${scale})`;
  t.style.visibility      = 'visible';
}

// visualViewport fires its own resize; fall back to window for desktop
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', rescale);
} else {
  window.addEventListener('resize', rescale);
}
window.addEventListener('orientationchange', () => setTimeout(rescale, 200));

// ════════════════════════════════════════════════════════════
//  SERVICE WORKER REGISTRATION
// ════════════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => {
        // iOS home-screen apps resume from memory for days instead of
        // relaunching, so a fresh deploy would never be noticed. Whenever
        // the app comes to the foreground (or regains connectivity, or
        // every 30 min while open) re-check sw.js AND compare the live
        // index.html against the version this page loaded with.
        const checkForUpdates = () => {
          if (navigator.onLine === false) return;
          reg.update().catch(()=>{});
          checkAppVersion();
        };
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') checkForUpdates();
        });
        window.addEventListener('online', checkForUpdates);
        setInterval(checkForUpdates, 30 * 60 * 1000);
        checkAppVersion(true);   // record this page's version as the baseline
      })
      .catch(err => console.warn('SW registration failed:', err));
  });
}

// Version check: compare the server's ETag (or Last-Modified) for
// index.html against the one recorded when this page loaded. HEAD requests
// bypass the service worker (it only handles GET), so this always reflects
// the live server — and it costs a few hundred bytes, not a full download.
let appVersionTag = null;
let updateBannerShown = false;
function checkAppVersion(baseline){
  fetch('/index.html', { method: 'HEAD', cache: 'no-store' }).then(res => {
    if (!res.ok) return;
    const tag = res.headers.get('etag') || res.headers.get('last-modified');
    if (!tag) return;
    if (baseline || appVersionTag === null) { appVersionTag = tag; return; }
    if (tag !== appVersionTag) showUpdateBanner();
  }).catch(() => {});   // offline: nothing to do
}

// Non-intrusive banner: one tap reloads into the new version. A reload
// mid-hand is safe — the in-flight hand is persisted and restored.
function showUpdateBanner(){
  if (updateBannerShown) return;
  updateBannerShown = true;
  const bar = document.createElement('div');
  bar.style.cssText = [
    'position:fixed','top:0','left:0','right:0','z-index:20000',
    'display:flex','align-items:center','justify-content:center','gap:14px',
    'padding:10px 14px','padding-top:calc(10px + env(safe-area-inset-top, 0px))',
    'background:linear-gradient(180deg,#1a3a8a,#0d2255)','border-bottom:2px solid #f0c040',
    'font-family:Arial,Helvetica,sans-serif','font-size:14px','font-weight:bold',
    'color:#f0c040','letter-spacing:1px','cursor:pointer',
    'box-shadow:0 4px 18px rgba(0,0,0,0.6)',
  ].join(';');
  const msg = document.createElement('span');
  msg.textContent = 'New version available — tap to update';
  const dismiss = document.createElement('span');
  dismiss.textContent = '✕';
  dismiss.style.cssText = 'color:#8899bb;padding:0 6px;font-size:16px;';
  dismiss.addEventListener('click', e => { e.stopPropagation(); bar.remove(); });
  bar.appendChild(msg);
  bar.appendChild(dismiss);
  bar.addEventListener('click', () => {
    saveState();            // make sure the live hand/bankroll are persisted
    location.reload();      // network-first SW serves the new build
  });
  document.body.appendChild(bar);
}
</script>
